<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiken × 口袋照片打印机 - 蓝牙联动 Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== 步骤指示器 ===== */
        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 24px 0;
            flex-wrap: wrap;
        }

        .step-back-btn {
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: #8892b0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .step-back-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .step-back-btn.hidden { visibility: hidden; }

        .step {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
        }
        .step:hover {
            background: rgba(255,255,255,0.08);
        }
        .step.current:hover {
            background: linear-gradient(135deg, #7b8cf0, #8b60b5);
        }

        .step.pending {
            background: rgba(255,255,255,0.05);
            color: #8892b0;
        }

        .step.current {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            animation: step-glow 2s infinite;
        }

        .step.completed {
            background: rgba(0,210,106,0.2);
            color: #00d26a;
        }

        @keyframes step-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(102,126,234,0.3); }
            50% { box-shadow: 0 0 15px rgba(102,126,234,0.5); }
        }

        .step-number {
            width: 20px; height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .step.pending .step-number { background: rgba(255,255,255,0.1); }
        .step.current .step-number { background: rgba(255,255,255,0.2); }
        .step.completed .step-number { background: rgba(0,210,106,0.3); }

        /* ===== 主内容区 ===== */
        .main-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 0;
            flex: 1;
            padding: 0 20px;
            align-items: stretch;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        /* ===== 手机栏 ===== */
        .phone-frame {
            width: 280px;
            background: #1c1c1e;
            border-radius: 24px;
            border: 3px solid #333;
            padding: 16px 12px 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            min-height: 500px;
        }

        .phone-notch {
            width: 80px; height: 20px;
            background: #000;
            border-radius: 0 0 12px 12px;
            margin: 0 auto 12px;
        }

        .phone-status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #aaa;
            padding: 0 4px 10px;
        }

        .phone-page-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 12px;
        }

        .phone-page-header .page-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            flex: 1;
            text-align: center;
        }

        .phone-page-header .back-btn {
            font-size: 0.8rem;
            color: #667eea;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 50px;
        }
        .phone-page-header .back-btn:hover { opacity: 0.8; }
        .phone-page-header .placeholder-right { min-width: 50px; }

        /* 开关样式 */
        .toggle-switch {
            position: relative;
            width: 44px; height: 26px;
            flex-shrink: 0;
        }
        .toggle-switch input { display: none; }
        .toggle-switch .slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #3a3a4a;
            border-radius: 13px;
            transition: all 0.3s;
            cursor: default;
        }
        .toggle-switch .slider::before {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 20px; height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .toggle-switch input:checked + .slider {
            background: #34c759;
        }
        .toggle-switch input:checked + .slider::before {
            transform: translateX(18px);
        }

        .phone-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.2s;
        }
        .phone-list-item:hover { background: rgba(255,255,255,0.03); }
        .phone-list-item.no-action { cursor: default; }
        .phone-list-item.no-action:hover { background: transparent; }
        .phone-list-item .item-label {
            font-size: 0.85rem;
            color: #fff;
        }
        .phone-list-item .item-arrow {
            color: #555;
            font-size: 0.8rem;
        }
        .phone-list-item .item-sub {
            font-size: 0.7rem;
            color: #888;
            margin-right: 8px;
        }

        .phone-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .phone-section-title {
            font-size: 0.75rem;
            color: #888;
            margin: 12px 0 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .phone-card {
            background: rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: all 0.2s;
        }

        .phone-card:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.15);
        }

        .phone-card.selected {
            border-color: rgba(102,126,234,0.5);
            background: rgba(102,126,234,0.1);
        }

        .phone-card .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .phone-card .card-subtitle {
            font-size: 0.7rem;
            color: #888;
        }

        .phone-card .printer-icon {
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            float: left;
            margin-right: 10px;
        }

        .phone-card .printer-icon-svg {
            width: 44px; height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            float: left;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .phone-alert {
            background: rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 12px;
            padding: 12px 14px;
            margin: 10px 0;
            text-align: center;
            animation: fadeIn 0.3s;
        }

        .phone-alert.error {
            background: rgba(255,71,87,0.1);
            border-color: rgba(255,71,87,0.3);
        }

        .phone-alert.success {
            background: rgba(0,210,106,0.1);
            border-color: rgba(0,210,106,0.3);
        }

        .phone-alert .alert-text {
            font-size: 0.78rem;
            color: #ffd700;
            margin-bottom: 8px;
        }
        .phone-alert.error .alert-text { color: #ff6b6b; }
        .phone-alert.success .alert-text { color: #00d26a; }

        .phone-btn {
            display: inline-block;
            padding: 7px 18px;
            border-radius: 20px;
            border: none;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .phone-btn:hover { background: rgba(255,255,255,0.25); }
        .phone-btn.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        .phone-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 10px rgba(102,126,234,0.4);
        }

        .phone-back {
            font-size: 0.75rem;
            color: #667eea;
            cursor: pointer;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .phone-back:hover { opacity: 0.8; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 连接图标区域 ===== */
        .connection-icon-area {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            align-self: center;
        }

        .link-icon {
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            font-size: 1.2rem;
            position: relative;
        }

        .link-icon.paired {
            background: rgba(0,210,106,0.15);
            border-color: #00d26a;
            box-shadow: 0 0 20px rgba(0,210,106,0.2);
        }

        .link-icon.connected-dim {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.08);
        }

        .link-icon.connecting {
            background: rgba(255,215,0,0.1);
            border-color: #ffd700;
            animation: linkBlink 0.6s infinite;
        }

        @keyframes linkBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .link-icon svg {
            width: 22px; height: 22px;
        }

        .link-label {
            font-size: 0.6rem;
            color: #8892b0;
            text-align: center;
            margin-top: 6px;
            white-space: nowrap;
        }

        .link-icon.paired + .link-label {
            color: #00d26a;
        }

        /* ===== 设备卡片（相机/打印机） ===== */
        .device-card {
            width: 100%;
            max-width: 300px;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .device-card.active {
            border-color: rgba(100,200,255,0.3);
            box-shadow: 0 0 20px rgba(100,200,255,0.08);
        }

        /* 状态栏 */
        .device-status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }

        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        /* 状态灯 */
        .status-dot.offline { background: #666; box-shadow: none; }
        .status-dot.standby-disconnected { background: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.4); }
        .status-dot.standby-connected { background: #4da6ff; box-shadow: 0 0 8px rgba(77,166,255,0.5); }
        .status-dot.camera-printing { background: #4da6ff; box-shadow: 0 0 8px rgba(77,166,255,0.5); animation: pulse 0.8s infinite; }
        .status-dot.printer-printing { background: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.4); animation: pulse 0.8s infinite; }
        .status-dot.orange { background: #ff8c00; box-shadow: 0 0 8px rgba(255,140,0,0.5); }
        .status-dot.orange-blink { background: #ff8c00; box-shadow: 0 0 8px rgba(255,140,0,0.5); animation: pulse 0.8s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* 引导提示动画 */
        @keyframes guideGlow {
            0%, 100% { 
                box-shadow: 0 0 8px rgba(102,126,234,0.6), 0 0 16px rgba(102,126,234,0.2), 0 0 32px rgba(102,126,234,0.1);
                border-color: rgba(102,126,234,0.5);
            }
            50% { 
                box-shadow: 0 0 20px rgba(102,126,234,1), 0 0 40px rgba(102,126,234,0.5), 0 0 60px rgba(102,126,234,0.2);
                border-color: rgba(102,126,234,1);
            }
        }
        .guide-highlight {
            animation: guideGlow 1s ease-in-out infinite;
            border-radius: 14px;
            border: 2px solid transparent;
            outline: 2px solid rgba(102,126,234,0.3);
            outline-offset: 2px;
        }
        .guide-highlight-btn {
            animation: guideGlow 1s ease-in-out infinite;
            border-radius: 12px;
            border: 2px solid transparent;
            outline: 2px solid rgba(102,126,234,0.3);
            outline-offset: 2px;
        }

        .power-btn {
            padding: 7px 16px;
            border-radius: 8px;
            border: none;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        .power-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 10px rgba(102,126,234,0.4);
        }
        .power-btn.on {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        }
        .power-btn:disabled {
            background: rgba(255,255,255,0.06);
            color: #444;
            cursor: not-allowed;
            opacity: 0.45;
        }
        .power-btn:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        /* 设备主体：左右结构 */
        .device-body {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .device-illustration {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .device-actions {
            flex: 1;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            width: 100%;
            padding: 14px 10px;
            border-radius: 12px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .shutter-btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
            font-size: 0.85rem;
        }
        .shutter-btn:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(243,156,18,0.4);
        }

        .print-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 0.85rem;
        }
        .print-btn:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }

        .printer-power-action-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            font-size: 0.85rem;
        }
        .printer-power-action-btn:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(231,76,60,0.4);
        }
        .printer-power-action-btn.pressed {
            background: linear-gradient(135deg, #00d26a, #27ae60);
            box-shadow: 0 0 20px rgba(0,210,106,0.5);
            animation: shortPress 0.3s ease-out;
        }

        @keyframes shortPress {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* 闪光效果 */
        .flash-effect {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
        }
        .flash-effect.active {
            animation: flash 0.3s ease-out;
        }
        @keyframes flash {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        /* ===== 底部下一步 ===== */
        .footer {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            text-align: center;
        }

        .next-btn {
            padding: 14px 60px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.08);
            color: #555;
        }

        .next-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .next-btn.enabled {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            cursor: pointer;
            opacity: 1;
        }
        .next-btn.enabled:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(102,126,234,0.4);
        }

        /* ===== 配对成功遮罩 ===== */
        .pair-success-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.3s;
        }
        .pair-success-overlay.hidden { display: none; }

        .pair-success-card {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(0,210,106,0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .pair-success-card .success-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .pair-success-card h3 {
            color: #fff;
            margin-bottom: 8px;
        }
        .pair-success-card p {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        /* ===== 提示 Toast ===== */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.85rem;
            z-index: 200;
            animation: fadeIn 0.3s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .toast.hidden { display: none; }

        /* ===== 响应式 ===== */
        @media (max-width: 1100px) {
            .main-container {
                flex-wrap: wrap;
                gap: 12px;
            }
            .connection-icon-area {
                flex: 0 0 60px;
            }
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }
            .connection-icon-area {
                transform: rotate(90deg);
                padding: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="flash-effect" id="flashEffect"></div>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>

    <!-- 步骤指示器 -->
    <div class="step-indicator" id="stepIndicator">
        <button class="step-back-btn" id="stepBackBtn" onclick="goToPrevStep()" title="返回上一步">← 返回</button>
        <div class="step current" id="step1" onclick="jumpToStep(1)">
            <span class="step-number">1</span>
            <span>配对绑定</span>
        </div>
        <div class="step pending" id="step2" onclick="jumpToStep(2)">
            <span class="step-number">2</span>
            <span>拍照</span>
        </div>
        <div class="step pending" id="step3" onclick="jumpToStep(3)">
            <span class="step-number">3</span>
            <span>印放</span>
        </div>
    </div>

    <!-- 主内容区：手机 | 相机 | 连接图标 | 打印机 -->
    <div class="main-container">
        <!-- 左1：手机（米家App） -->
        <div class="column" id="phoneColumn">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="phone-status-bar">
                    <span>9:41</span>
                    <span>📶 🔋</span>
                </div>
                <div class="phone-content" id="phoneContent">
                    <!-- 动态渲染 -->
                </div>
            </div>
        </div>

        <!-- 左2：Aiken 相机 -->
        <div class="column">
            <div class="device-card" id="aikenCard">
                <div class="device-status-bar">
                    <div class="status-left">
                        <div class="status-dot offline" id="aikenStatusDot"></div>
                        <span id="aikenStatusText">已关机</span>
                    </div>
                </div>
                <div class="device-body">
                    <div class="device-illustration">
                        <svg width="90" height="70" viewBox="0 0 200 140">
                            <rect x="10" y="30" width="180" height="95" rx="12" fill="#2d2d3a" stroke="#444" stroke-width="2"/>
                            <rect x="15" y="25" width="170" height="8" rx="4" fill="#3a3a4a"/>
                            <circle cx="100" cy="78" r="28" fill="#1a1a2e" stroke="#555" stroke-width="2"/>
                            <circle cx="100" cy="78" r="18" fill="#0d0d1a" stroke="#444" stroke-width="1"/>
                            <circle cx="100" cy="78" r="8" fill="#1a1a2e"/>
                            <rect x="30" y="40" width="20" height="14" rx="3" fill="#1a1a2e" stroke="#555" stroke-width="1.5"/>
                            <circle cx="165" cy="50" r="8" fill="#c0392b"/>
                            <rect x="150" y="27" width="25" height="6" rx="3" fill="#888"/>
                            <circle cx="155" cy="88" r="5" fill="#333" id="aikenLED"/>
                            <text x="100" y="138" text-anchor="middle" fill="#777" font-size="10">AIKEN</text>
                        </svg>
                    </div>
                    <div class="device-actions" style="flex-direction:row;gap:8px;">
                        <button class="action-btn shutter-btn" id="shutterBtn" onclick="takePhoto()" disabled style="flex:1;">
                            快门
                        </button>
                        <button class="action-btn print-btn" id="printBtn" onclick="triggerPrintFromCamera()" disabled style="flex:1;">
                            印放
                        </button>
                    </div>
                </div>
                <!-- 照片预览区域 -->
                <div id="photoArea" style="width:100%;aspect-ratio:4/3;margin-top:14px;border:2px dashed rgba(255,255,255,0.2);border-radius:10px;overflow:hidden;position:relative;">
                    <span id="photoPlaceholder" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;font-size:0.8rem;">未拍摄</span>
                    <img id="aikenPhotoImg" src="" style="width:100%;height:100%;object-fit:cover;display:none;">
                </div>
            </div>
        </div>

        <!-- 中：连接图标 -->
        <div class="connection-icon-area">
            <div style="display:flex;flex-direction:column;align-items:center;">
                <div class="link-icon" id="linkIcon">
                    <svg viewBox="0 0 24 24" fill="none" id="linkSvg">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" 
                              stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" 
                              stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>

            </div>

        <!-- 右：打印机 -->
        <div class="column">
            <div class="device-card" id="printerCard">
                <div class="device-status-bar">
                    <div class="status-left">
                        <div class="status-dot offline" id="printerStatusDot"></div>
                        <span id="printerStatusText">已关机</span>
                    </div>
                </div>
                <div class="device-body">
                    <div class="device-illustration">
                        <svg width="90" height="80" viewBox="0 0 160 140">
                            <rect x="20" y="30" width="120" height="90" rx="10" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
                            <rect x="20" y="25" width="120" height="12" rx="6" fill="#e8e8e8"/>
                            <rect x="35" y="50" width="90" height="55" rx="4" fill="#fafafa" stroke="#eee" stroke-width="1"/>
                            <rect x="50" y="45" width="60" height="8" rx="2" fill="#333"/>
                            <circle cx="130" cy="55" r="5" fill="#333" id="printerLED"/>
                            <rect x="130" y="70" width="14" height="20" rx="3" fill="#c0392b"/>
                            <text x="80" y="132" text-anchor="middle" fill="#aaa" font-size="9">POCKET PRINTER</text>
                        </svg>
                    </div>
                    <div class="device-actions">
                        <button class="action-btn printer-power-action-btn" id="printerActionBtn" onclick="shortPressPrinterPower()">
                            电源/配对
                        </button>
                    </div>
                </div>
                <!-- 打印机照片区域 -->
                <div id="printerPhotoArea" style="width:100%;aspect-ratio:4/3;margin-top:14px;border:2px dashed rgba(255,255,255,0.2);border-radius:10px;overflow:hidden;position:relative;">
                    <span id="printerPhotoPlaceholder" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;font-size:0.8rem;">未打印</span>
                    <img id="printerPhotoImg" src="" style="width:100%;height:100%;object-fit:cover;display:none;">
                </div>

    <!-- 底部：下一步 -->
    <div class="footer">
        <button class="next-btn" id="nextBtn" disabled onclick="handleNext()">
            下一步 →
        </button>
    </div>

    <!-- 配对成功弹窗 -->
    <div class="pair-success-overlay hidden" id="pairSuccessOverlay">
        <div class="pair-success-card">
            <div class="success-icon">✅</div>
            <h3>配对成功！</h3>
            <p>Aiken 相机已与 Ricotta 打印机成功配对</p>
            <button class="phone-btn primary" style="font-size:0.9rem;padding:10px 24px;" onclick="closeSuccessOverlay()">
                知道了
            </button>
        </div>
    </div>

    <script>
        // ===== 状态管理 =====
        let state = {
            // 当前步骤
            currentStep: 1,
            // 设备电源
            aikenOn: true,
            printerOn: false,
            // 配对流程
            paired: false,
            // 手机 App 页面状态: 'home' | 'printerList' | 'pairing' | 'photo' | 'pairedStatus'
            phonePage: 'home',
            // 选中的打印机
            selectedPrinter: null, // 'Mint' | 'Ricotta' | null
            // 打印机短按电源键完成配对
            printerPowerShortPressed: false,
            // 拍照相关
            photoTaken: false,
            photoUrl: null,
            photosRemaining: 36,
            // 连接和打印
            connecting: false,
            connected: false,
            printing: false,
            printed: false,
            // 印放传输状态
            transferring: false,
            transferFailed: false,
        };

        // ===== Toast =====
        function showToast(msg, duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), duration);
        }

        // ===== 步骤指示器 =====
        function updateStep(stepNum) {
            for (let i = 1; i <= 3; i++) {
                const step = document.getElementById(`step${i}`);
                if (i < stepNum) step.className = 'step completed';
                else if (i === stepNum) step.className = 'step current';
                else step.className = 'step pending';
            }
        }

        // ===== 下一步按钮 =====
        function updateNextButton() {
            const btn = document.getElementById('nextBtn');
            if (state.currentStep === 1) {
                // 第一步：配对成功后才可用
                btn.disabled = !state.paired;
                btn.className = state.paired ? 'next-btn enabled' : 'next-btn';
            } else if (state.currentStep === 2) {
                // 第二步：拍照后才可用
                btn.disabled = !state.photoTaken;
                btn.className = state.photoTaken ? 'next-btn enabled' : 'next-btn';
            } else {
                btn.disabled = true;
                btn.className = 'next-btn';
            }
        }

        function handleNext() {
            if (state.currentStep === 1 && state.paired) {
                goToStep2();
            } else if (state.currentStep === 2 && state.photoTaken) {
                goToStep3();
            }
        }

        // ===== 连接图标 =====
        function updateLinkIcon() {
            const icon = document.getElementById('linkIcon');
            const label = document.getElementById('linkLabel');
            const svg = document.getElementById('linkSvg');
            if (state.paired) {
                icon.className = 'link-icon paired';
                label.textContent = '已配对';
                svg.querySelectorAll('path').forEach(p => p.setAttribute('stroke', '#00d26a'));
            } else {
                icon.className = 'link-icon';
                label.textContent = '未配对';
                svg.querySelectorAll('path').forEach(p => p.setAttribute('stroke', '#666'));
            }
        }

        // ===== Aiken 相机电源 =====
        function startConnecting() {
            state.connecting = true;
            updateLinkIconConnecting();            // 3秒后连接成功
            setTimeout(() => {
                state.connecting = false;
                state.connected = true;
                updateLinkIconActive();                renderPhone();
            }, 3000);
        }

        function updateLinkIconConnecting() {
            const icon = document.getElementById('linkIcon');
            const label = document.getElementById('linkLabel');
            const svg = document.getElementById('linkSvg');
            icon.className = 'link-icon connecting';
            label.textContent = '连接中';
            svg.querySelectorAll('path').forEach(p => p.setAttribute('stroke', '#ffd700'));
        }

        function updateStatusLights() {
            const aikenDot = document.getElementById('aikenStatusDot');
            const printerDot = document.getElementById('printerStatusDot');
            const aikenText = document.getElementById('aikenStatusText');
            const printerText = document.getElementById('printerStatusText');

            // 相机状态灯
            if (!state.aikenOn) {
                aikenDot.className = 'status-dot offline';
                aikenText.textContent = '已关机';
            } else if (state.transferFailed && !state.transferring) {
                // 传输失败：橙色常亮或闪烁（未拍照时闪烁）
                if (!state.photoTaken) {
                    aikenDot.className = 'status-dot orange-blink';
                    aikenText.textContent = '无照片，任务失败';
                } else {
                    aikenDot.className = 'status-dot orange';
                    aikenText.textContent = '未找到打印机，任务失败';
                }
            } else if (state.transferring) {
                aikenDot.className = 'status-dot camera-printing';
                aikenText.textContent = '发起打印，传输照片中';
            } else if (state.printing) {
                aikenDot.className = 'status-dot camera-printing';
                aikenText.textContent = '发起打印，传输照片中';
            } else if (state.connected) {
                aikenDot.className = 'status-dot standby-connected';
                aikenText.textContent = '待机中，打印机已连接';
            } else {
                aikenDot.className = 'status-dot standby-disconnected';
                aikenText.textContent = '待机中，打印机未连接';
            }

            // 打印机状态灯
            if (!state.printerOn) {
                printerDot.className = 'status-dot offline';
                printerText.textContent = '已关机';
            } else if (state.printing) {
                printerDot.className = 'status-dot printer-printing';
                printerText.textContent = '打印中';
            } else if (state.connected) {
                printerDot.className = 'status-dot standby-disconnected';
                printerText.textContent = '待机中，相机已连接';
            } else {
                printerDot.className = 'status-dot standby-disconnected';
                printerText.textContent = '已开机 · 待机中';
            }
        }

        function updatePrinterActionBtn() {
            const btn = document.getElementById('printerActionBtn');
            // 步骤1配对连接后隐藏、步骤2始终隐藏、步骤3始终显示
            if ((state.currentStep === 1 || state.currentStep === 2) && state.paired && state.connected) {
                btn.style.display = 'none';
            } else {
                btn.style.display = '';
                btn.disabled = false;
            }
        }

        // ===== 打印机电源键短按（配对确认） =====
        function shortPressPrinterPower() {
            const btn = document.getElementById('printerActionBtn');
            btn.classList.add('pressed');
            setTimeout(() => btn.classList.remove('pressed'), 300);

            if (!state.printerOn) {
                // 关机状态：开机并连接
                state.printerOn = true;
                state.connected = false;
                state.connecting = false;
                state.printing = false;
                state.printed = false;
                state.transferFailed = false;
                updateStatusLights();
                document.getElementById('printerLED').setAttribute('fill', '#00d26a');
                // 显示打印机照片区域
                document.getElementById('printerPhotoImg').style.display = 'none';
                const pph = document.getElementById('printerPhotoPlaceholder');
                if (pph) pph.style.display = 'block';
                // 启动连接
                startConnecting();
                // 第一步配对：手机正在等待短按配对，完成配对
                if (state.phonePage === 'pairing' && state.selectedPrinter && state.currentStep === 1) {
                    state.printerPowerShortPressed = true;
                    completePairing();
                }
                // 步骤3：开机后连接图标恢复
                if (state.currentStep === 3) {
                    updateLinkIconStep2();
                }
                return;
            }

            // 开机状态：步骤3是关机
            if (state.currentStep === 3) {
                state.printerOn = false;
                state.connected = false;
                state.connecting = false;
                state.printing = false;
                state.printed = false;
                state.transferFailed = false;
                updateStatusLights();
                document.getElementById('printerLED').setAttribute('fill', '#333');
                document.getElementById('printerPhotoImg').style.display = 'none';
                const pph = document.getElementById('printerPhotoPlaceholder');
                if (pph) pph.style.display = 'block';
                updateLinkIconStep2();
                return;
            }

            // 开机状态：步骤1短按配对
            if (state.currentStep === 1 && state.phonePage === 'pairing' && state.selectedPrinter) {
                state.printerPowerShortPressed = true;
                completePairing();
            }
        }

        function startPrinting() {
            state.printing = true;            // 模拟传输打印过程：渐进显示照片
            const img = document.getElementById('printerPhotoImg');

            state.connected = true;

        function triggerPrintFromCamera() {
            if (!state.aikenOn) return;

            // 清除之前状态
            state.transferFailed = false;
            state.transferring = false;

            if (!state.photoTaken) {
                // 未拍照：橙色闪烁，3秒后恢复
                state.transferFailed = true;
                state.transferring = false;
                updateStatusLights();
                setTimeout(() => {
                    state.transferFailed = false;
                    updateStatusLights();
                    setTimeout(applyGuides, 100);
                }, 3000);
                return;
            }

            // 已拍照：蓝色闪烁，3秒后判断
            state.transferring = true;
            updateStatusLights();

            setTimeout(() => {
                state.transferring = false;
                if (state.connected && state.printerOn) {
                    // 打印机已连接 → 传输成功，开始打印
                    state.transferFailed = false;
                    updateStatusLights();
                    startPrinting();
                } else {
                    // 打印机未连接 → 传输失败
                    state.transferFailed = true;
                    updateStatusLights();
                }
                setTimeout(applyGuides, 100);
            }, 3000);
        }

        // ===== 下一步 =====
        function goToStep2() {
            if (!state.paired) return;
            state.currentStep = 2;
            state.phonePage = 'pairedStatus';
            updateStep(2);
            // 打印机开机，已配对且连接成功
            state.printerOn = true;
            state.connected = true;
            state.connecting = false;
            updateStatusLights();            document.getElementById('printerLED').setAttribute('fill', '#00d26a');            // 连接图标：已连接亮色
            updateLinkIconActive();
            // 显示相机照片区域
            document.getElementById('shutterBtn').disabled = false;
            updateNextButton();
            updateBackButton(2);
            updateDeviceButtonsVisibility();
            updatePrinterActionBtn();
            renderPhone();
        }

        function updateLinkIconStep2() {
            const icon = document.getElementById('linkIcon');
            const label = document.getElementById('linkLabel');
            const svg = document.getElementById('linkSvg');
            icon.className = 'link-icon connected-dim';
            label.textContent = '已连接';
            svg.querySelectorAll('path').forEach(p => p.setAttribute('stroke', '#555'));
        }

        function updateLinkIconActive() {
            const icon = document.getElementById('linkIcon');
            const label = document.getElementById('linkLabel');
            const svg = document.getElementById('linkSvg');
            icon.className = 'link-icon paired';
            label.textContent = '已连接';
            svg.querySelectorAll('path').forEach(p => p.setAttribute('stroke', '#00d26a'));
        }

        function goToStep3() {
            state.currentStep = 3;
            state.phonePage = 'pairedStatus';
            state.printerOn = true;
            state.connected = true;
            state.connecting = false;
            state.printing = false;
            state.printed = false;
            state.transferFailed = false;
            updateStep(3);
            updateStatusLights();
            document.getElementById('printerLED').setAttribute('fill', '#00d26a');
            // 显示打印机照片区域
            document.getElementById('printerPhotoImg').style.display = 'none';
            const pph = document.getElementById('printerPhotoPlaceholder');
            if (pph) pph.style.display = 'block';
            updateLinkIconActive();
            updateNextButton();
            updateBackButton(3);
            updateDeviceButtonsVisibility();
            updatePrinterActionBtn();
            renderPhone();
        }

        function goToPrevStep() {
            if (state.currentStep <= 1) return;
            jumpToStep(state.currentStep - 1);
        }

        function jumpToStep(stepNum) {
            if (stepNum < 1 || stepNum > 3) return;
            // 隐藏返回按钮（第一步没有返回）
            updateBackButton(stepNum);
            // 更新步骤指示器
            updateStep(stepNum);
            // 重置到对应步骤的初始状态
            switch (stepNum) {
                case 1:
                    resetToStep1();
                    break;
                case 2:
                    resetToStep2();
                    break;
                case 3:
                    resetToStep3();
                    break;
            }
        }

        function updateBackButton(stepNum) {
            const btn = document.getElementById('stepBackBtn');
            if (stepNum <= 1) {
                btn.classList.add('hidden');
            } else {
                btn.classList.remove('hidden');
            }
        }

        function clearAllGuides() {
            document.querySelectorAll('.guide-highlight, .guide-highlight-btn').forEach(el => {
                el.classList.remove('guide-highlight', 'guide-highlight-btn');
            });
        }

        function updateDeviceButtonsVisibility() {
            const shutterBtn = document.getElementById('shutterBtn');
            const printBtn = document.getElementById('printBtn');
            if (state.currentStep === 1) {
                shutterBtn.style.display = 'none';
                printBtn.style.display = 'none';
            } else {
                shutterBtn.style.display = '';
                printBtn.style.display = '';
            }
        }

        function applyGuides() {
            clearAllGuides();
            if (state.currentStep === 1) {
                if (state.phonePage === 'home') {
                    // 首页：引导点击配对口袋打印机
                    const entry = document.getElementById('pairPrinterEntry');
                    if (entry) entry.classList.add('guide-highlight');
                } else if (state.phonePage === 'printerList') {
                    // 打印机列表：引导点击第一台打印机
                    const cards = document.querySelectorAll('#phoneContent .phone-card');
                    if (cards.length > 0) cards[0].classList.add('guide-highlight');
                } else if (state.phonePage === 'pairing') {
                    if (state.paired) {
                        // 配对成功，引导点击下一步
                        document.getElementById('nextBtn').classList.add('guide-highlight-btn');
                    } else if (!state.printerOn) {
                        // 提示开机：引导点击打印机开机按钮
                        document.getElementById('printerActionBtn').classList.add('guide-highlight-btn');
                    } else if (!state.printerPowerShortPressed) {
                        // 提示短按电源键：引导点击打印机电源按钮
                        document.getElementById('printerActionBtn').classList.add('guide-highlight-btn');
                    }
                }
            } else if (state.currentStep === 2) {
                if (!state.photoTaken) {
                    // 引导点击快门
                    document.getElementById('shutterBtn').classList.add('guide-highlight-btn');
                } else {
                    // 拍照完成，引导点击下一步
                    document.getElementById('nextBtn').classList.add('guide-highlight-btn');
                }
            } else if (state.currentStep === 3) {
                if (!state.printerOn) {
                    // 引导打开打印机
                    document.getElementById('printerActionBtn').classList.add('guide-highlight-btn');
                } else if (!state.connected && !state.connecting) {
                    // 等待连接完成
                } else if (state.connected && !state.printed) {
                    // 引导点击印放或电源
                    document.getElementById('printBtn').classList.add('guide-highlight-btn');
                }
            }
        }

        function resetToStep1() {
            state.currentStep = 1;
            state.aikenOn = true;
            state.printerOn = false;
            state.paired = false;
            state.phonePage = 'home';
            state.selectedPrinter = null;
            state.printerPowerShortPressed = false;
            state.photoTaken = false;
            state.photoUrl = null;
            state.photosRemaining = 36;
            // UI 重置
            setAikenOnSilent();
            updateStatusLights();
            updateStatusLights();            document.getElementById('printerLED').setAttribute('fill', '#333');            
            document.getElementById('aikenPhotoImg').style.display = 'none';
            const ph = document.getElementById('photoPlaceholder');
            if (ph) ph.style.display = 'block';
            document.getElementById('shutterBtn').disabled = true; 
            updateLinkIcon();
            updateNextButton();
            updateBackButton(1);
            updateDeviceButtonsVisibility();
            renderPhone();
        }

        function resetToStep2() {
            state.currentStep = 2;
            state.printerOn = true;
            state.connected = true;
            state.connecting = false;
            state.paired = true;
            state.phonePage = 'pairedStatus';
            state.printerPowerShortPressed = false;
            state.photoTaken = false;
            state.photoUrl = null;
            state.photosRemaining = 36;
            state.printing = false;
            state.printed = false;
            state.transferring = false;
            state.transferFailed = false;
            // UI
            setAikenOnSilent();
            document.getElementById('shutterBtn').disabled = false;
            updateStatusLights();            document.getElementById('printerLED').setAttribute('fill', '#00d26a');            
            document.getElementById('aikenPhotoImg').style.display = 'none';
            const ph = document.getElementById('photoPlaceholder');
            if (ph) ph.style.display = 'block';
            updateLinkIconActive();
            updateNextButton();
            updateBackButton(2);
            updateDeviceButtonsVisibility();
            updatePrinterActionBtn();
            renderPhone();
        }

function resetDemo() {
            state = {
                currentStep: 1,
                aikenOn: false,
                printerOn: false,
                paired: false,
                phonePage: 'home',
                selectedPrinter: null,
                printerPowerShortPressed: false,
                photoTaken: false,
                photoUrl: null,
                photosRemaining: 36,
                connecting: false,
                connected: false,
                printing: false,
                printed: false,
                transferring: false,
                transferFailed: false,
            };
            // 重置 Aiken UI
            updateStatusLights();            document.getElementById('aikenLED').setAttribute('fill', '#333');
            document.getElementById('shutterBtn').disabled = true;
            document.getElementById('printBtn').disabled = true;
            // 重置打印机 UI
            updateStatusLights();
            updateStatusLights();            document.getElementById('printerLED').setAttribute('fill', '#333');            // 重置照片区域
            
            document.getElementById('aikenPhotoImg').style.display = 'none';
            const placeholder = document.getElementById('photoPlaceholder');
            if (placeholder) placeholder.style.display = 'block';
            // 重置打印机照片区域
            
            document.getElementById('printerPhotoImg').style.display = 'none';
            const pph = document.getElementById('printerPhotoPlaceholder');
            if (pph) pph.style.display = 'block';
            // 重置连接图标和按钮
            updateLinkIcon();
            updateNextButton();
            updateStep(1);
            updateBackButton(1);
            updateDeviceButtonsVisibility();
            renderPhone();
        }

        // ===== 手机 App 页面渲染 =====
        function renderPhone() {
            const container = document.getElementById('phoneContent');

            switch (state.phonePage) {
                case 'home':
                    renderHomePage(container);
                    break;
                case 'printerList':
                    renderPrinterListPage(container);
                    break;
                case 'pairing':
                    renderPairingPage(container);
                    break;
                case 'photo':
                    renderPhotoPage(container);
                    break;
                case 'pairedStatus':
                    renderPairedStatusPage(container);
                    break;
            }
            // 渲染完成后应用引导
            setTimeout(applyGuides, 100);
        }

        function renderHomePage(container) {
            container.innerHTML = `
                <div class="phone-page-header">
                    <div class="placeholder-right"></div>
                    <div class="page-title">相机插件设置页</div>
                    <div class="placeholder-right"></div>
                </div>

                <div class="phone-list-item no-action">
                    <span class="item-label">相机设置</span>
                    <span class="item-arrow">›</span>
                </div>

                <div class="phone-list-item guide-highlight" id="pairPrinterEntry" onclick="goToPrinterList()">
                    <span class="item-label">配对口袋打印机</span>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <span class="item-sub">${state.paired ? '已配对 · ' + (state.selectedPrinter || '') : '未配对'}</span>
                        <span class="item-arrow">›</span>
                    </div>
                </div>
            `;
        }

        function goToPrinterList() {
            state.phonePage = 'printerList';
            state.selectedPrinter = null;
            state.printerPowerShortPressed = false;
            renderPhone();
        }

        function renderPrinterListPage(container) {
            container.innerHTML = `
                <div class="phone-page-header">
                    <div class="back-btn" onclick="goBackToHome()">← 返回</div>
                    <div class="page-title">配对口袋打印机</div>
                    <div class="placeholder-right"></div>
                </div>
                <div class="phone-section-title">附近的打印机</div>

                <div class="phone-card ${state.selectedPrinter === 'Mint' ? 'selected' : ''}" onclick="selectPrinter('Mint')">
                    <div class="printer-icon-svg">
                        ${pocketPrinterSVG('#c0c0c0')}
                    </div>
                    <div style="overflow:hidden;">
                        <div class="card-title">Mint</div>
                        <div class="card-subtitle">米家口袋照片打印机1S</div>
                    </div>
                </div>

                <div class="phone-card ${state.selectedPrinter === 'Ricotta' ? 'selected' : ''}" onclick="selectPrinter('Ricotta')">
                    <div class="printer-icon-svg">
                        ${pocketPrinterSVG('#ffffff')}
                    </div>
                    <div style="overflow:hidden;">
                        <div class="card-title">Ricotta</div>
                        <div class="card-subtitle">米家口袋照片打印机Pro</div>
                    </div>
                </div>

                <div id="phoneAlertArea"></div>
            `;
        }

        function goBackToHome() {
            state.phonePage = 'home';
            state.selectedPrinter = null;
            state.printerPowerShortPressed = false;
            renderPhone();
        }

        function selectPrinter(name) {
            state.selectedPrinter = name;
            state.phonePage = 'pairing';
            state.printerPowerShortPressed = false;
            renderPhone();
        }

        function renderPairingPage(container) {
            const printerName = state.selectedPrinter || '未知';
            const printerColor = state.selectedPrinter === 'Mint' ? '#c0c0c0' : '#ffffff';
            const printerOn = state.printerOn;
            const shortPressed = state.printerPowerShortPressed;
            const paired = state.paired;

            let alertHtml = '';
            if (paired) {
                alertHtml = `
                    <div class="phone-alert success">
                        <div class="alert-text">✅ 配对成功！</div>
                        <div style="font-size:0.75rem;color:#00d26a;">Aiken ↔ ${printerName} 已建立连接</div>
                    </div>
                `;
            } else if (!printerOn) {
                alertHtml = `
                    <div class="phone-alert error">
                        <div class="alert-text">⚠️ 请打开打印机</div>
                        <div style="font-size:0.72rem;color:#ff6b6b;margin-bottom:8px;">${printerName} 当前处于关机状态</div>
                        <button class="phone-btn" onclick="retryCheck()">重试</button>
                    </div>
                `;
            } else if (!shortPressed) {
                alertHtml = `
                    <div class="phone-alert">
                        <div class="alert-text">🔔 请短按打印机电源键完成配对</div>
                        <div style="font-size:0.72rem;color:#ffd700;margin-bottom:8px;">按下打印机右侧的「电源」按钮</div>
                        <button class="phone-btn" onclick="retryCheck()">重试</button>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="phone-page-header">
                    <div class="back-btn" onclick="goBackToPrinterList()">← 返回</div>
                    <div class="page-title">配对口袋打印机</div>
                    <div class="placeholder-right"></div>
                </div>

                <div style="display:flex;align-items:center;justify-content:center;gap:16px;padding:16px 0;">
                    <div style="text-align:center;">
                        ${cameraSVG()}
                        <div style="font-size:0.65rem;color:#888;">Aiken</div>
                    </div>
                    <div style="font-size:1.2rem;color:#888;">⟷</div>
                    <div style="text-align:center;">
                        ${pocketPrinterSVG(printerColor)}
                        <div style="font-size:0.65rem;color:#888;">${printerName}</div>
                    </div>
                </div>

                <div id="phoneAlertArea">${alertHtml}</div>
            `;
        }

        function goBackToPrinterList() {
            if (state.paired) return; // 配对成功后不允许返回
            state.phonePage = 'printerList';
            state.selectedPrinter = null;
            state.printerPowerShortPressed = false;
            renderPhone();
        }

        function retryCheck() {
            // 重新检查条件
            if (!state.printerOn) {
                showToast('打印机尚未开机，请先打开打印机');
            } else if (!state.printerPowerShortPressed) {
                showToast('请短按打印机右侧的「电源」按钮');
            }
            renderPhone();
        }

        // ===== 拍照页面 =====
        const samplePhotos = [
            'https://images.unsplash.com/photo-1506905925346-21bda4d32df2?w=400&h=300&fit=crop',
            'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&h=300&fit=crop',
            'https://images.unsplash.com/photo-1441974231531-c6227db76b84?w=400&h=300&fit=crop',
            'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&h=300&fit=crop'
        ];

        function renderPhotoPage(container) {
            container.innerHTML = `
                <div class="phone-page-header">
                    <div class="placeholder-right"></div>
                    <div class="page-title">拍照</div>
                    <div class="placeholder-right"></div>
                </div>
                <div style="text-align:center;padding:8px 0;">
                    <span style="font-size:0.8rem;color:#888;">剩余 ${state.photosRemaining} 张</span>
                </div>
                <div class="photo-preview" id="phonePhotoPreview" style="width:100%;height:160px;background:rgba(0,0,0,0.3);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:10px 0;overflow:hidden;position:relative;">
                    <span class="placeholder" style="color:#555;font-size:0.8rem;">📸 拍摄的照片将显示在这里</span>
                    <img class="photo-img" id="phonePhotoImg" src="" style="width:100%;height:100%;object-fit:cover;display:none;">
                </div>
                <button class="phone-btn primary" style="width:100%;padding:12px;font-size:0.9rem;margin-top:8px;" onclick="takePhotoFromPhone()">
                    📸 按下快门拍照
                </button>
                ${state.photoTaken ? `
                <div style="text-align:center;margin-top:12px;color:#00d26a;font-size:0.8rem;">
                    ✅ 照片已拍摄，请进入下一步
                </div>` : ''}
            `;
        }

        function renderPairedStatusPage(container) {
            const printerName = state.selectedPrinter || '未知';
            const printerColor = state.selectedPrinter === 'Mint' ? '#c0c0c0' : '#ffffff';
            container.innerHTML = `
                <div class="phone-page-header">
                    <div class="placeholder-right"></div>
                    <div class="page-title">配对口袋打印机</div>
                    <div class="placeholder-right"></div>
                </div>
                <div class="phone-alert success">
                    <div class="alert-text">✅ 配对成功！</div>
                    <div style="font-size:0.75rem;color:#00d26a;">Aiken ↔ ${printerName} 已建立连接</div>
                </div>
                <div style="display:flex;align-items:center;justify-content:center;gap:16px;padding:16px 0;">
                    <div style="text-align:center;">
                        ${cameraSVG()}
                        <div style="font-size:0.65rem;color:#888;">Aiken</div>
                    </div>
                    <div style="font-size:1.2rem;color:#00d26a;">⟷</div>
                    <div style="text-align:center;">
                        ${pocketPrinterSVG(printerColor)}
                        <div style="font-size:0.65rem;color:#888;">${printerName}</div>
                    </div>
                </div>
                <div style="text-align:center;color:#888;font-size:0.75rem;margin-top:4px;">
                    请打开打印机以激活连接
                </div>
            `;
        }

        function takePhotoFromPhone() {
            takePhoto();
        }

        // ===== 初始化 =====
        function initAikenUI() {
            updateStatusLights();
            document.getElementById('aikenLED').setAttribute('fill', '#fff');
            document.getElementById('shutterBtn').disabled = false;
            document.getElementById('printBtn').disabled = false;
            updatePrinterActionBtn();
        }

        updateStep(1);
        initAikenUI();
        updateBackButton(1);
        updateDeviceButtonsVisibility();
        renderPhone();
        updateNextButton();
        updateLinkIcon();
    </script>
</body>
</html>
