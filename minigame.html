<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>抽拉节奏 — 解锁庆祝</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--app-bg:#11100F;--accent:#E53935;--gold:#F6C83C;--text-soft:#F2ECE4;--text-dim:#A39C91}
html,body{width:100%;height:100%;overflow:hidden;background:#f4f4f5;font-family:"Space Mono",ui-monospace,Menlo,Consolas,"PingFang SC",sans-serif;color:var(--text-soft)}
body{display:flex;justify-content:center;align-items:center}
.stage{position:relative;width:425.55px;height:675.80px;flex-shrink:0}
.phone-frame{position:absolute;inset:0 120px 0 0;background:linear-gradient(135deg,#E0A982,#A35E2E);border-radius:52px;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 4px 1px rgba(255,255,255,.4)}
.phone-bezel{position:absolute;inset:6.67px 126.67px 6.67px 6.67px;background:#000;border-radius:45.33px}
.phone-screen{position:absolute;inset:10.83px 130.83px 10.83px 10.83px;background:var(--app-bg);overflow:hidden;border-radius:41.17px}
.phone-side-btn{position:absolute;top:163.20px;right:117px;width:2.99px;height:77.41px;background:linear-gradient(270deg,#7A4726,#D18E5F);border-radius:0 2px 2px 0}
.page-name{position:absolute;left:305.55px;top:0;bottom:0;width:120px;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:2px;color:rgba(120,113,104,.85);writing-mode:vertical-rl}
.dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:24px;z-index:6}
.status-bar{position:absolute;top:0;left:0;right:0;height:57px;display:flex;align-items:center;justify-content:space-between;padding:21.5px 24px 0;font-size:14px;font-weight:700;color:#fff;z-index:5}
.status-icons{display:flex;gap:6px;align-items:center}
.home-indicator{position:absolute;bottom:5.5px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:#fff;opacity:.8;border-radius:9999px;z-index:5}
.game-screen{position:absolute;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
.game-header{position:absolute;top:57px;left:0;right:0;padding:12px 24px 0;z-index:4}
.game-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.game-title{font-size:11px;letter-spacing:1.5px;color:var(--text-dim)}
.game-score{font-size:14px;font-weight:700;color:var(--gold)}
.progress-track{width:100%;height:3px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .1s linear}
.rhythm-area{position:absolute;top:120px;left:50%;transform:translateX(-50%);width:80px;bottom:210px;overflow:hidden}
.lane{position:relative;width:100%;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(229,57,53,.06) 50%,rgba(255,255,255,.02));border-left:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.06)}
.lane::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.04);transform:translateX(-50%)}
.hit-line{position:absolute;left:-10px;right:-10px;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 12px rgba(246,200,60,.4);z-index:3}
.hit-line::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;height:60px;border:2px solid rgba(246,200,60,.25);border-radius:50%}
.note{position:absolute;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;will-change:transform;z-index:2}
.note.pull{background:radial-gradient(circle,rgba(229,57,53,.9),rgba(229,57,53,.3) 70%,transparent);border:2px solid var(--accent);box-shadow:0 0 16px rgba(229,57,53,.4);color:#fff}
.note.fast{background:radial-gradient(circle,rgba(246,200,60,.9),rgba(246,200,60,.3) 70%,transparent);border:2px solid var(--gold);box-shadow:0 0 16px rgba(246,200,60,.4);color:#11100F}
.note.hold{background:radial-gradient(circle,rgba(56,94,119,.9),rgba(56,94,119,.3) 70%,transparent);border:2px solid #385E77;box-shadow:0 0 16px rgba(56,94,119,.4);color:#F1B434}
.note .arrow{font-size:20px;line-height:1}
.note.hit-anim{animation:noteHit .3s ease-out forwards}
@keyframes noteHit{0%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) scale(2.5);opacity:0}}
.note.miss-anim{animation:noteMiss .4s ease-out forwards}
@keyframes noteMiss{0%{opacity:.6}100%{opacity:0;transform:translateX(-50%) translateY(20px)}}
/* ── 相机产品图 ── */
.camera-zone{position:absolute;left:0;right:0;bottom:85.61px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;z-index:4}
.camera-hint{font-size:9px;letter-spacing:1px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;transition:color .2s}
.camera-hint.active{color:var(--accent)}
.camera-container{position:relative;width:200px;height:78px;cursor:grab;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.camera-container.grabbing{cursor:grabbing;transition:none}
.camera-container.pulled{transform:translateY(8px)}
.camera-sprite{width:200px;height:78px;background-image:url(assets/aiken-2-ref.jpg);background-size:400px 78px;background-position:0 0;transition:background-position .15s cubic-bezier(.34,1.56,.64,1);border-radius:6px}
.camera-sprite.open{background-position:-200px 0}
.camera-container.grabbing .camera-sprite{transition:none}
.camera-glow{position:absolute;inset:-4px;border-radius:8px;box-shadow:0 0 0 0 rgba(229,57,53,0);transition:box-shadow .2s;pointer-events:none}
.camera-container.pulled .camera-glow{box-shadow:0 0 20px 4px rgba(229,57,53,.3)}
.pull-arrow{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-size:14px;color:var(--text-dim);opacity:.6;animation:bounceDown 1.5s ease-in-out infinite;pointer-events:none}
@keyframes bounceDown{0%,100%{transform:translateX(-50%) translateY(0);opacity:.3}50%{transform:translateX(-50%) translateY(6px);opacity:.7}}
.judge-text{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:24px;font-weight:700;letter-spacing:2px;pointer-events:none;z-index:5;opacity:0}
.judge-text.show{animation:judgePop .5s ease-out forwards}
@keyframes judgePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1) translateY(-20px)}}
.judge-text.perfect{color:var(--gold);text-shadow:0 0 12px rgba(246,200,60,.5)}
.judge-text.good{color:#4CAF50;text-shadow:0 0 12px rgba(76,175,80,.5)}
.judge-text.miss{color:#666}
.combo-display{position:absolute;right:24px;top:160px;text-align:right;z-index:4;opacity:0;transition:opacity .2s}
.combo-display.show{opacity:1}
.combo-num{font-size:32px;font-weight:700;color:var(--accent);line-height:1}
.combo-label{font-size:9px;letter-spacing:1px;color:var(--text-dim);margin-top:2px}
.overlay{position:absolute;inset:0;background:rgba(17,16,15,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:opacity .4s ease}
.overlay.hidden{opacity:0;pointer-events:none}
.overlay-icon{width:64px;height:64px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:20px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,.3)}50%{box-shadow:0 0 0 12px rgba(229,57,53,0)}}
.overlay-title{font-size:18px;font-weight:700;color:var(--text-soft);letter-spacing:1px;margin-bottom:8px;text-align:center}
.overlay-desc{font-size:11px;color:var(--text-dim);letter-spacing:.5px;text-align:center;max-width:220px;line-height:1.6;margin-bottom:28px}
.overlay-btn{padding:14px 40px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;letter-spacing:1.5px;border-radius:8px;cursor:pointer;border:none;font-family:inherit;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 16px rgba(229,57,53,.3)}
.overlay-btn:active{transform:scale(.95)}
.result-stats{display:flex;gap:24px;margin-bottom:24px}
.result-stat{text-align:center}
.result-stat .num{font-size:22px;font-weight:700;color:var(--gold)}
.result-stat .lbl{font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-top:2px}
.confetti{position:absolute;width:8px;height:8px;pointer-events:none;z-index:9;will-change:transform,opacity}
.tab-bar{position:absolute;left:0;right:0;bottom:0;height:85.61px;background:rgba(17,17,17,.95);border-top:.61px solid rgba(255,255,255,.05);display:flex;justify-content:space-around;align-items:flex-start;padding:16.61px 0 0;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-dim);font-size:10px;letter-spacing:.5px;cursor:pointer}
.tab .icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.tab.active{color:#fff}
.tab:not(.active){opacity:.5}
@media(max-width:480px){body{padding:0;align-items:center;background:var(--app-bg)}.stage{width:100vw!important;height:100vh!important}.phone-frame,.phone-bezel,.phone-side-btn,.page-name{display:none!important}.phone-screen{position:relative!important;inset:0!important;border-radius:0!important;width:100vw;height:100vh}}
</style>
</head>

<div class="status-bar">

<span class="status-icons">
<svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="8" width="2.5" height="4" rx=".5" fill="#fff"/><rect x="3.5" y="6" width="2.5" height="6" rx=".5" fill="#fff"/><rect x="7" y="4" width="2.5" height="8" rx=".5" fill="#fff"/><rect x="10.5" y="2" width="2.5" height="10" rx=".5" fill="#fff"/></svg>
<svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M7 9.5l-1.6-1.6a2.3 2.3 0 013.2 0L7 9.5z" fill="#fff"/><path d="M2 4.4a7 7 0 0110 0l-1 1a5.7 5.7 0 00-8 0l-1-1z" fill="#fff"/><path d="M0 2.4a10 10 0 0114 0l-1 1a8.6 8.6 0 00-12 0l-1-1z" fill="#fff"/></svg>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var cameraContainer=$('cameraContainer'),cameraSprite=$('cameraSprite'),cameraHint=$('cameraHint');
var lane=$('lane'),judgeText=$('judgeText'),scoreDisplay=$('scoreDisplay');
var progressFill=$('progressFill'),comboDisplay=$('comboDisplay'),comboNum=$('comboNum');
var startOverlay=$('startOverlay'),endOverlay=$('endOverlay');
var startBtn=$('startBtn'),retryBtn=$('retryBtn');
var endScore=$('endScore'),endMaxCombo=$('endMaxCombo'),endAccuracy=$('endAccuracy');
var endTitle=$('endTitle'),endDesc=$('endDesc'),gameScreen=$('gameScreen');

var state='idle',notes=[],score=0,combo=0,maxCombo=0,hitCount=0,totalNotes=0;
var startTime=0,isGrabbing=false,grabStartY=0,hasPulledThisNote=false,rafId=null;
var pullThreshold=20; // px drag distance to trigger pull

var chart=[
{t:2000,type:'pull'},{t:3000,type:'pull'},{t:4000,type:'fast'},
{t:5000,type:'pull'},{t:6000,type:'pull'},{t:7000,type:'fast'},
{t:8000,type:'pull'},{t:9000,type:'hold'},{t:10500,type:'pull'},
{t:11500,type:'fast'},{t:12500,type:'pull'},{t:13500,type:'pull'},
{t:14500,type:'fast'},{t:15500,type:'pull'},{t:16500,type:'hold'},
{t:18000,type:'pull'},{t:19000,type:'fast'},{t:20000,type:'pull'},
{t:21000,type:'pull'},{t:22000,type:'fast'},{t:23000,type:'pull'},
{t:24000,type:'pull'},{t:25000,type:'fast'},{t:26000,type:'pull'}
];

var NOTE_SPEED=0.25,HIT_WINDOW=350,PERFECT_WINDOW=150,GOOD_WINDOW=280;

var audioCtx=null;
function initAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}}
function playTone(freq,dur,vol){
  if(!audioCtx)return;
  var osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.frequency.value=freq;osc.type='sine';
  gain.gain.setValueAtTime(vol||0.15,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.15));
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start();osc.stop(audioCtx.currentTime+(dur||0.15));
}
function playHitSound(p){playTone(p?880:660,0.12,0.12);if(p)setTimeout(function(){playTone(1320,0.08,0.08)},30)}
function playMissSound(){playTone(200,0.2,0.1)}
function playUnlockSound(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){playTone(f,0.3,0.15)},i*120)})}

function createNoteEl(note){
  var el=document.createElement('div');el.className='note '+note.type;
  var a=document.createElement('span');a.className='arrow';
  a.textContent=note.type==='hold'?'\u2933':(note.type==='fast'?'\u26A1':'\u2193');
  el.appendChild(a);note.el=el;lane.appendChild(el);
}

function startGame(){
  initAudio();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  notes.forEach(function(n){if(n.el)n.el.remove()});
  notes=[];score=0;combo=0;maxCombo=0;hitCount=0;
  scoreDisplay.textContent='0';
  comboDisplay.classList.remove('show');
  progressFill.style.width='0%';
  resetCamera();
  totalNotes=chart.length;
  chart.forEach(function(c){notes.push({t:c.t,type:c.type,hit:false,missed:false,el:null,spawned:false})});
  state='playing';
  startOverlay.classList.add('hidden');
  endOverlay.classList.add('hidden');
  startTime=performance.now();
  rafId=requestAnimationFrame(gameLoop);
}

function gameLoop(now){
  if(state!=='playing')return;
  var elapsed=now-startTime;
  var lastT=chart[chart.length-1].t;
  progressFill.style.width=Math.min(100,(elapsed/(lastT+1000))*100)+'%';
  var laneH=lane.getBoundingClientRect().height;
  var hitY=laneH-28;
  notes.forEach(function(n){
    if(n.spawned)return;
    var t=n.t-elapsed;
    if(t<2000&&t>-HIT_WINDOW){n.spawned=true;createNoteEl(n)}
  });
  notes.forEach(function(n){
    if(!n.spawned||n.hit||n.missed)return;
    var t=n.t-elapsed;
    n.el.style.top=(hitY-t*NOTE_SPEED)+'px';
    if(t<-HIT_WINDOW&&!n.hit){
      n.missed=true;n.el.classList.add('miss-anim');
      (function(m){setTimeout(function(){if(m.el)m.el.remove()},400)})(n);
      combo=0;comboDisplay.classList.remove('show');
      showJudge('miss','MISS');playMissSound();
    }
  });
  // 节点接近判定线时高亮提示
  var nearHit=notes.some(function(n){return n.spawned&&!n.hit&&!n.missed&&Math.abs(n.t-elapsed)<HIT_WINDOW});
  cameraHint.classList.toggle('active',nearHit);
  if(notes.every(function(n){return n.hit||n.missed})&&elapsed>lastT+500){endGame();return}
  rafId=requestAnimationFrame(gameLoop);
}

function checkPullHit(){
  if(state!=='playing')return;
  var elapsed=performance.now()-startTime;
  var closest=null,diff=Infinity;
  notes.forEach(function(n){
    if(n.hit||n.missed||!n.spawned)return;
    var d=Math.abs(n.t-elapsed);
    if(d<diff){diff=d;closest=n}
  });
  if(!closest||diff>HIT_WINDOW)return;
  var judge,perfect;
  if(diff<PERFECT_WINDOW){judge='perfect';perfect=true;score+=100}
  else if(diff<GOOD_WINDOW){judge='good';perfect=false;score+=60}
  else{judge='good';perfect=false;score+=30}
  closest.hit=true;hitCount++;combo++;
  if(combo>maxCombo)maxCombo=combo;
  score+=combo*2;
  scoreDisplay.textContent=score;
  comboNum.textContent=combo;
  comboDisplay.classList.add('show');
  showJudge(judge,judge.toUpperCase());
  playHitSound(perfect);
  closest.el.classList.add('hit-anim');
  (function(n){setTimeout(function(){if(n.el)n.el.remove()},300)})(closest);
}

function showJudge(cls,txt){
  judgeText.className='judge-text '+cls;
  judgeText.textContent=txt;
  judgeText.classList.remove('show');
  void judgeText.offsetWidth;
  judgeText.classList.add('show');
}

function endGame(){
  state='ended';
  if(rafId)cancelAnimationFrame(rafId);
  var acc=totalNotes>0?Math.round((hitCount/totalNotes)*100):0;
  endScore.textContent=score;
  endMaxCombo.textContent=maxCombo;
  endAccuracy.textContent=acc+'%';
  if(acc>=80){
    endTitle.textContent='STYLE UNLOCKED';
    endDesc.textContent='Cinestill 800T';
    playUnlockSound();spawnConfetti();
  }else{
    endTitle.textContent='TRY AGAIN';
    endDesc.textContent='\u51C6\u786E\u7387 '+acc+'%\uFF0C\u9700\u8985 80% \u4EE5\u4E0A';
  }
  endOverlay.classList.remove('hidden');
}

function spawnConfetti(){
  var colors=['#E53935','#F6C83C','#4CAF50','#385E77','#F2ECE4'];
  for(var i=0;i<40;i++){
    var c=document.createElement('div');c.className='confetti';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.left=(Math.random()*100)+'%';c.style.top='50%';
    c.style.borderRadius=Math.random()>0.5?'50%':'2px';
    gameScreen.appendChild(c);
    var a=Math.random()*Math.PI*2,v=100+Math.random()*200;
    var vx=Math.cos(a)*v,vy=Math.sin(a)*v-100,st=performance.now();
    (function(c,vx,vy,st){
      requestAnimationFrame(function an(now){
        var dt=(now-st)/1000;
        if(dt>2){c.remove();return}
        var x=vx*dt,y=vy*dt+200*dt*dt;
        c.style.transform='translate('+x+'px,'+y+'px) rotate('+(dt*360)+'deg)';
        c.style.opacity=Math.max(0,1-dt/2);
        requestAnimationFrame(an);
      });
    })(c,vx,vy,st);
  }
}

// ── 相机交互 ──
function resetCamera(){
  cameraContainer.classList.remove('pulled','grabbing');
  cameraSprite.classList.remove('open');
  hasPulledThisNote=false;
}

function triggerPull(){
  // 触发抽拉：相机切换到拉开状态，判定节奏
  cameraContainer.classList.add('pulled');
  cameraSprite.classList.add('open');
  checkPullHit();
  // 0.2s 后弹回合上状态
  setTimeout(function(){
    cameraContainer.classList.remove('pulled');
    cameraSprite.classList.remove('open');
  },200);
  // 0.35s 后允许下一次抽拉
  setTimeout(function(){hasPulledThisNote=false},350);
}

// Pointer Events 拖拽
function onDown(e){
  if(state!=='playing')return;
  e.preventDefault();
  isGrabbing=true;
  grabStartY=e.clientY;
  hasPulledThisNote=false;
  cameraContainer.classList.add('grabbing');
  try{cameraContainer.setPointerCapture(e.pointerId)}catch(err){}
}
function onMove(e){
  if(!isGrabbing)return;
  e.preventDefault();
  var deltaY=e.clientY-grabStartY;
  // 向下拖拽时，相机跟随移动（最多 12px）
  var visualY=Math.max(0,Math.min(12,deltaY));
  cameraContainer.style.transform=visualY?'translateY('+visualY+'px)':'';
  // 拖拽超过阈值时触发抽拉
  if(deltaY>pullThreshold&&!hasPulledThisNote){
    hasPulledThisNote=true;
    triggerPull();
  }
}
function onUp(e){
  if(!isGrabbing)return;
  isGrabbing=false;
  cameraContainer.classList.remove('grabbing');
  cameraContainer.style.transform='';
  // 如果没有拖拽（视为点击），也触发抽拉
  if(!hasPulledThisNote){
    hasPulledThisNote=true;
    triggerPull();
  }
}

cameraContainer.addEventListener('pointerdown',onDown);
cameraContainer.addEventListener('pointermove',onMove);
cameraContainer.addEventListener('pointerup',onUp);
cameraContainer.addEventListener('pointercancel',onUp);

startBtn.addEventListener('click',startGame);
retryBtn.addEventListener('click',startGame);

// 键盘空格也能触发抽拉（桌面测试用）
document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&state==='playing'){
    e.preventDefault();
    if(!hasPulledThisNote){
      hasPulledThisNote=true;
      triggerPull();
    }
  }
  if(e.code==='Enter'&&state!=='playing'){startGame()}
});
})();
</script>
