<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>抽拉节奏 — 解锁庆祝</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--app-bg:#11100F;--accent:#E53935;--gold:#F6C83C;--text-soft:#F2ECE4;--text-dim:#A39C91;--page-bg:#E8E4DE}
html,body{width:100%;height:100%;overflow:hidden;background:var(--page-bg);font-family:"Space Mono",ui-monospace,Menlo,Consolas,"PingFang SC",sans-serif;color:#2a2a2a}
body{display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;gap:80px;padding:40px 60px}

/* ── 左侧：相机产品图 ── */
.camera-panel{display:flex;flex-direction:column;align-items:center;gap:16px}
.camera-label{font-size:12px;letter-spacing:2px;color:#888;text-transform:uppercase}
.camera-clickable{position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;border-radius:12px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.15);transition:box-shadow .2s,transform .15s}
.camera-clickable:active{transform:scale(.97)}
.camera-clickable.flash{box-shadow:0 0 0 3px var(--accent),0 8px 28px rgba(229,57,53,.3)}
.camera-img{display:block;width:220px;height:auto}
.camera-hint{font-size:11px;letter-spacing:1px;color:#999;text-transform:uppercase;transition:color .2s;min-width:140px;text-align:center}
.camera-hint.active{color:var(--accent);font-weight:700}
.camera-hint.active::before{content:'>>> '}

/* ── 右侧：手机（iPhone 15 Pro 比例，缩放至适合页面） ── */
.stage{position:relative;width:260px;height:563px;flex-shrink:0}
.phone-frame{position:absolute;inset:0;background:linear-gradient(135deg,#E0A982,#A35E2E);border-radius:48px;box-shadow:0 20px 50px rgba(0,0,0,.25),inset 0 0 4px 1px rgba(255,255,255,.4)}
.phone-bezel{position:absolute;inset:5px;background:#000;border-radius:43px}
.phone-screen{position:absolute;inset:9px;background:var(--app-bg);overflow:hidden;border-radius:39px}
.phone-side-btn{position:absolute;top:160px;right:-3px;width:3px;height:70px;background:linear-gradient(270deg,#7A4726,#D18E5F);border-radius:0 2px 2px 0}
.page-name{position:absolute;left:0;top:0;bottom:0;width:14px;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:2px;color:rgba(120,113,104,.85);writing-mode:vertical-rl}
.dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:105px;height:31px;background:#000;border-radius:20px;z-index:6}
.status-bar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0;font-size:13px;font-weight:700;color:#fff;z-index:5}
.status-icons{display:flex;gap:5px;align-items:center}
.home-indicator{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:110px;height:4px;background:#fff;opacity:.85;border-radius:9999px;z-index:5}
.game-screen{position:absolute;inset:0;user-select:none;-webkit-user-select:none}
.game-header{position:absolute;top:48px;left:0;right:0;padding:10px 20px 0;z-index:4}
.game-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.game-title{font-size:10px;letter-spacing:1.5px;color:var(--text-dim)}
.game-score{font-size:14px;font-weight:700;color:var(--gold)}
.progress-track{width:100%;height:3px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .1s linear}
.rhythm-area{position:absolute;top:100px;left:50%;transform:translateX(-50%);width:70px;bottom:100px;overflow:hidden}
.lane{position:relative;width:100%;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(229,57,53,.06) 50%,rgba(255,255,255,.02));border-left:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.06)}
.lane::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.04);transform:translateX(-50%)}
.hit-line{position:absolute;left:-8px;right:-8px;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 12px rgba(246,200,60,.4);z-index:3}
.hit-line::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50px;height:50px;border:2px solid rgba(246,200,60,.25);border-radius:50%}
.note{position:absolute;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;will-change:transform;z-index:2}
.note.pull{background:radial-gradient(circle,rgba(229,57,53,.9),rgba(229,57,53,.3) 70%,transparent);border:2px solid var(--accent);box-shadow:0 0 16px rgba(229,57,53,.4);color:#fff}
.note.fast{background:radial-gradient(circle,rgba(246,200,60,.9),rgba(246,200,60,.3) 70%,transparent);border:2px solid var(--gold);box-shadow:0 0 16px rgba(246,200,60,.4);color:#11100F}
.note.hold{background:radial-gradient(circle,rgba(56,94,119,.9),rgba(56,94,119,.3) 70%,transparent);border:2px solid #385E77;box-shadow:0 0 16px rgba(56,94,119,.4);color:#F1B434}
.note .arrow{font-size:18px;line-height:1}
.note.hit-anim{animation:noteHit .3s ease-out forwards}
@keyframes noteHit{0%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) scale(2.5);opacity:0}}
.note.miss-anim{animation:noteMiss .4s ease-out forwards}
@keyframes noteMiss{0%{opacity:.6}100%{opacity:0;transform:translateX(-50%) translateY(20px)}}
.judge-text{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:22px;font-weight:700;letter-spacing:2px;pointer-events:none;z-index:5;opacity:0}
.judge-text.show{animation:judgePop .5s ease-out forwards}
@keyframes judgePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1) translateY(-20px)}}
.judge-text.perfect{color:var(--gold);text-shadow:0 0 12px rgba(246,200,60,.5)}
.judge-text.good{color:#4CAF50;text-shadow:0 0 12px rgba(76,175,80,.5)}
.judge-text.miss{color:#666}
.combo-display{position:absolute;right:20px;top:130px;text-align:right;z-index:4;opacity:0;transition:opacity .2s}
.combo-display.show{opacity:1}
.combo-num{font-size:28px;font-weight:700;color:var(--accent);line-height:1}
.combo-label{font-size:8px;letter-spacing:1px;color:var(--text-dim);margin-top:2px}
.overlay{position:absolute;inset:0;background:rgba(17,16,15,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:opacity .4s ease}
.overlay.hidden{opacity:0;pointer-events:none}
.overlay-icon{width:56px;height:56px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,.3)}50%{box-shadow:0 0 0 12px rgba(229,57,53,0)}}
.overlay-title{font-size:16px;font-weight:700;color:var(--text-soft);letter-spacing:1px;margin-bottom:6px;text-align:center}
.overlay-desc{font-size:10px;color:var(--text-dim);letter-spacing:.5px;text-align:center;max-width:200px;line-height:1.6;margin-bottom:24px}
.overlay-btn{padding:12px 36px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;letter-spacing:1.5px;border-radius:8px;cursor:pointer;border:none;font-family:inherit;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 16px rgba(229,57,53,.3)}
.overlay-btn:active{transform:scale(.95)}
.result-stats{display:flex;gap:20px;margin-bottom:20px}
.result-stat{text-align:center}
.result-stat .num{font-size:20px;font-weight:700;color:var(--gold)}
.result-stat .lbl{font-size:8px;color:var(--text-dim);letter-spacing:1px;margin-top:2px}
.confetti{position:absolute;width:8px;height:8px;pointer-events:none;z-index:9;will-change:transform,opacity}
.tab-bar{position:absolute;left:0;right:0;bottom:0;height:70px;background:rgba(17,17,17,.95);border-top:.5px solid rgba(255,255,255,.05);display:flex;justify-content:space-around;align-items:flex-start;padding:12px 0 0;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-dim);font-size:9px;letter-spacing:.5px;cursor:pointer}
.tab .icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.tab.active{color:#fff}
.tab:not(.active){opacity:.5}
@media(max-width:820px){body{grid-template-columns:1fr;gap:20px;padding:12px}.camera-panel{order:2}.camera-img{width:160px}.stage{width:100vw!important;height:100vh!important}.phone-frame,.phone-bezel,.phone-side-btn,.page-name{display:none!important}.phone-screen{position:relative!important;inset:0!important;border-radius:0!important;width:100vw;height:100vh}}
</style>
</head>

var state='idle',notes=[],score=0,combo=0,maxCombo=0,hitCount=0,totalNotes=0;
var startTime=0,rafId=null;
var isPulling=false;

var chart=[
{t:2000,type:'pull'},{t:3000,type:'pull'},{t:4000,type:'fast'},
{t:5000,type:'pull'},{t:6000,type:'pull'},{t:7000,type:'fast'},
{t:8000,type:'pull'},{t:9000,type:'hold'},{t:10500,type:'pull'},
{t:11500,type:'fast'},{t:12500,type:'pull'},{t:13500,type:'pull'},
{t:14500,type:'fast'},{t:15500,type:'pull'},{t:16500,type:'hold'},
{t:18000,type:'pull'},{t:19000,type:'fast'},{t:20000,type:'pull'},
{t:21000,type:'pull'},{t:22000,type:'fast'},{t:23000,type:'pull'},
{t:24000,type:'pull'},{t:25000,type:'fast'},{t:26000,type:'pull'}
];

var NOTE_SPEED=0.25,HIT_WINDOW=350,PERFECT_WINDOW=150,GOOD_WINDOW=280;

var audioCtx=null;
function initAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}}
function playTone(freq,dur,vol){
  if(!audioCtx)return;
  var osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.frequency.value=freq;osc.type='sine';
  gain.gain.setValueAtTime(vol||0.15,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.15));
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start();osc.stop(audioCtx.currentTime+(dur||0.15));
}
function playHitSound(p){playTone(p?880:660,0.12,0.12);if(p)setTimeout(function(){playTone(1320,0.08,0.08)},30)}
function playMissSound(){playTone(200,0.2,0.1)}
function playUnlockSound(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){playTone(f,0.3,0.15)},i*120)})}

function createNoteEl(note){
  var el=document.createElement('div');el.className='note '+note.type;
  var a=document.createElement('span');a.className='arrow';
  a.textContent=note.type==='hold'?'\u2933':(note.type==='fast'?'\u26A1':'\u2193');
  el.appendChild(a);note.el=el;lane.appendChild(el);
}

function startGame(){
  initAudio();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  notes.forEach(function(n){if(n.el)n.el.remove()});
  notes=[];score=0;combo=0;maxCombo=0;hitCount=0;
  scoreDisplay.textContent='0';
  comboDisplay.classList.remove('show');
  progressFill.style.width='0%';
  resetCamera();
  totalNotes=chart.length;
  chart.forEach(function(c){notes.push({t:c.t,type:c.type,hit:false,missed:false,el:null,spawned:false})});
  state='playing';
  startOverlay.classList.add('hidden');
  endOverlay.classList.add('hidden');
  startTime=performance.now();
  rafId=requestAnimationFrame(gameLoop);
}

function gameLoop(now){
  if(state!=='playing')return;
  var elapsed=now-startTime;
  var lastT=chart[chart.length-1].t;
  progressFill.style.width=Math.min(100,(elapsed/(lastT+1000))*100)+'%';
  var laneH=lane.getBoundingClientRect().height;
  var hitY=laneH-24;
  notes.forEach(function(n){
    if(n.spawned)return;
    var t=n.t-elapsed;
    if(t<2000&&t>-HIT_WINDOW){n.spawned=true;createNoteEl(n)}
  });
  notes.forEach(function(n){
    if(!n.spawned||n.hit||n.missed)return;
    var t=n.t-elapsed;
    n.el.style.top=(hitY-t*NOTE_SPEED)+'px';
    if(t<-HIT_WINDOW&&!n.hit){
      n.missed=true;n.el.classList.add('miss-anim');
      (function(m){setTimeout(function(){if(m.el)m.el.remove()},400)})(n);
      combo=0;comboDisplay.classList.remove('show');
      showJudge('miss','MISS');playMissSound();
    }
  });
  var nearHit=notes.some(function(n){return n.spawned&&!n.hit&&!n.missed&&Math.abs(n.t-elapsed)<HIT_WINDOW});
  cameraHint.classList.toggle('active',nearHit);
  if(notes.every(function(n){return n.hit||n.missed})&&elapsed>lastT+500){endGame();return}
  rafId=requestAnimationFrame(gameLoop);
}

function checkPullHit(){
  if(state!=='playing')return;
  var elapsed=performance.now()-startTime;
  var closest=null,diff=Infinity;
  notes.forEach(function(n){
    if(n.hit||n.missed||!n.spawned)return;
    var d=Math.abs(n.t-elapsed);
    if(d<diff){diff=d;closest=n}
  });
  if(!closest||diff>HIT_WINDOW){
    showJudge('miss','MISS');playMissSound();combo=0;comboDisplay.classList.remove('show');
    return;
  }
  var judge,perfect;
  if(diff<PERFECT_WINDOW){judge='perfect';perfect=true;score+=100}
  else if(diff<GOOD_WINDOW){judge='good';perfect=false;score+=60}
  else{judge='good';perfect=false;score+=30}
  closest.hit=true;hitCount++;combo++;
  if(combo>maxCombo)maxCombo=combo;
  score+=combo*2;
  scoreDisplay.textContent=score;
  comboNum.textContent=combo;
  comboDisplay.classList.add('show');
  showJudge(judge,judge.toUpperCase());
  playHitSound(perfect);
  closest.el.classList.add('hit-anim');
  (function(n){setTimeout(function(){if(n.el)n.el.remove()},300)})(closest);
}

function showJudge(cls,txt){
  judgeText.className='judge-text '+cls;
  judgeText.textContent=txt;
  judgeText.classList.remove('show');
  void judgeText.offsetWidth;
  judgeText.classList.add('show');
}

function endGame(){
  state='ended';
  if(rafId)cancelAnimationFrame(rafId);
  var acc=totalNotes>0?Math.round((hitCount/totalNotes)*100):0;
  endScore.textContent=score;
  endMaxCombo.textContent=maxCombo;
  endAccuracy.textContent=acc+'%';
  if(acc>=80){
    endTitle.textContent='STYLE UNLOCKED';
    endDesc.textContent='Cinestill 800T';
    playUnlockSound();spawnConfetti();
  }else{
    endTitle.textContent='TRY AGAIN';
    endDesc.textContent='\u51C6\u786E\u7387 '+acc+'%\uFF0C\u9700\u8985 80% \u4EE5\u4E0A';
  }
  endOverlay.classList.remove('hidden');
}

function spawnConfetti(){
  var colors=['#E53935','#F6C83C','#4CAF50','#385E77','#F2ECE4'];
  for(var i=0;i<40;i++){
    var c=document.createElement('div');c.className='confetti';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.left=(Math.random()*100)+'%';c.style.top='50%';
    c.style.borderRadius=Math.random()>0.5?'50%':'2px';
    gameScreen.appendChild(c);
    var a=Math.random()*Math.PI*2,v=100+Math.random()*200;
    var vx=Math.cos(a)*v,vy=Math.sin(a)*v-100,st=performance.now();
    (function(c,vx,vy,st){
      requestAnimationFrame(function an(now){
        var dt=(now-st)/1000;
        if(dt>2){c.remove();return}
        var x=vx*dt,y=vy*dt+200*dt*dt;
        c.style.transform='translate('+x+'px,'+y+'px) rotate('+(dt*360)+'deg)';
        c.style.opacity=Math.max(0,1-dt/2);
        requestAnimationFrame(an);
      });
    })(c,vx,vy,st);
  }
}

// ── 相机点击交互：每次点击 = 一次抽拉（拉开→自动合上） ──
function resetCamera(){
  cameraClickable.classList.remove('flash');
  cameraImg.src=IMG_CLOSED;
  isPulling=false;
}

function onCameraClick(){
  if(state!=='playing')return;
  if(isPulling)return;
  isPulling=true;
  // 拉开：切换图片
  cameraImg.src=IMG_OPEN;
  cameraClickable.classList.add('flash');
  checkPullHit();
  // 0.25s 后自动合上
  setTimeout(function(){
    cameraImg.src=IMG_CLOSED;
  },250);
  // 0.35s 后允许下一次点击
  setTimeout(function(){
    cameraClickable.classList.remove('flash');
    isPulling=false;
  },350);
}

cameraClickable.addEventListener('click',onCameraClick);

startBtn.addEventListener('click',startGame);
retryBtn.addEventListener('click',startGame);

document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&state==='playing'){
    e.preventDefault();
    onCameraClick();
  }
  if(e.code==='Enter'&&state!=='playing'){startGame()}
});
})();
</script>
