<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyConcepts · 等待3小时冲扫的意义</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f242e;
      --border: #2a303c;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --accent: #6c8cff;
      --accent-2: #ff7a59;
      --radius: 14px;

      /* 胶片 App 主题色 —— 严格对齐 Figma */
      --phone-frame-1: #d49275;
      --phone-frame-2: #a06850;
      --app-bg: #11100F;
      --app-text: #F2ECE4;
      --app-muted: #A39C91;
      --app-card: #161513;
      --app-border: #2C2927;
      --chip-bg: #2C2927;
      --chip-text: #E6DFD3;
      --green: #4ade80;
      /* 胶片色（Figma 精确值） */
      --c-cinestill: #E53935;
      --c-gold: #F6C83C;
      --c-portra: #FCD02C;
      --c-velvia: #008000;
      --c-vision3: #385E77;
      --c-hp5: #C9C9C9;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: "Space Mono", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .layout { display: flex; height: 100vh; width: 100%; }

    /* ---------- 左半边：展示区 (2/3) ---------- */
    .stage {
      flex: 0 0 66.6667%;
      max-width: 66.6667%;
      /* 沉浸式深色舞台：径向渐变 + 微噪点质感 */
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255,122,89,0.10) 0%, transparent 55%),
        radial-gradient(90% 70% at 50% 100%, rgba(74,222,128,0.06) 0%, transparent 50%),
        var(--stage-bg);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    /* 舞台底部柔光托底，让手机有「悬浮」感 */
    .stage__body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      overflow: hidden;
    }
    .card--app {
      align-items: center;
      justify-content: center;
      min-height: 0;
      background: transparent;
      border: none;
      padding: 0;
      flex: 0 0 auto;
    }
    .card__title {
      font-size: 13px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    /* ---------- 手机外壳 ---------- */
    /* 用高度反推宽度：iPhone 14 Pro 比例 390:844 */
    .phone {
      flex: 0 0 auto;
      height: 100%;
      max-height: 100%;
      aspect-ratio: 327.20 / 697.45;
      border-radius: 44px;
      padding: 7px;
      background: linear-gradient(150deg, #2a2a2e 0%, #141416 45%, #0c0c0e 100%);
      /* 多层阴影：贴地投影 + 悬浮光晕 + 边缘高光 */
      box-shadow:
        0 40px 80px -20px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.06),
        inset 0 0 2px 1px rgba(255,255,255,0.12);
      display: flex;
      position: relative;
    }
    /* 侧边按键装饰 */
    .phone::before,
    .phone::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(180deg, #3a3a3e, #1a1a1c);
      border-radius: 2px;
      left: -3px;
    }
    .phone::before { top: 130px; height: 30px; }
    .phone::after  { top: 170px; height: 60px; box-shadow: 0 64px 0 #2a2a2e; }
    .phone__screen {
      flex: 1;
      border-radius: 44px;
      background: var(--app-bg);
      color: var(--app-text);
      position: relative;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .phone__notch {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 26px;
      background: #000; border-radius: 14px; z-index: 10;
    }

    /* ---------- App 屏幕通用 ---------- */
    .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
    .screen.hidden { display: none; }
    /* 所有屏幕统一内边距，保证手机尺寸恒定不闪烁 */
    .app-inner { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    /* ---------- 相机主屏（Figma 精确还原） ---------- */
    .camera-screen { align-items: center; }
    .cam-top {
      display: flex; justify-content: space-between; align-items: flex-end;
      width: 100%; padding: 24px 24px 16px;
      position: relative; z-index: 5;
    }
    .cam-conn { display: flex; align-items: center; gap: 8px; }
    .cam-conn .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 8px rgba(74,222,128,0.6);
    }
    .cam-conn span {
      font-size: 12px; color: var(--app-muted);
      letter-spacing: 1.2px; font-weight: 400;
    }
    .cam-fill {
      font-size: 10px; color: var(--app-muted); letter-spacing: 1px; font-weight: 400;
    }

    /* 胶片名（点击进入选择） */
    .film-title-btn {
      background: none; border: none; cursor: pointer;
      width: 100%; padding: 100px 0 4px;
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 5; font-family: inherit;
    }
    .film-title {
      font-size: 20px; font-weight: 700;
      letter-spacing: 0.02em; color: var(--app-text);
      text-align: center; line-height: 1.15;
    }
    .film-title.cinestill { color: var(--c-cinestill); }
    .film-title.gold { color: var(--c-gold); }
    .film-title.portra { color: var(--c-portra); }
    .film-title.velvia { color: var(--c-velvia); }
    .film-title.vision3 { color: var(--c-vision3); }
    .film-title.hp5 { color: var(--c-hp5); }
    .film-title.dim { color: var(--app-muted); }

    /* 环形进度 224px */
    .ring-wrap {
      position: relative;
      width: 224px; height: 224px;
      margin: 24px 0;
    }
    .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
    .ring-bg { fill: none; stroke: #1f1d1b; stroke-width: 4; }
    .ring-fg {
      fill: none; stroke-width: 4; stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease, stroke 0.3s;
    }
    .ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px;
    }
    .ring-count {
      font-size: 60px; font-weight: 400; line-height: 1;
      color: var(--app-text); letter-spacing: -0.02em;
      background: none; border: none; font-family: inherit;
      padding: 4px 18px; cursor: pointer; border-radius: 8px;
      transition: background 0.15s;
    }
    .ring-count:hover { background: rgba(255,255,255,0.05); }
    .ring-label {
      font-size: 10px; letter-spacing: 1px;
      color: var(--app-muted); font-weight: 400;
    }

    /* 底部卸载按钮（Figma #2C2927 / #E6DFD3，圆角 6px） */
    .unload-btn {
      width: 240px; max-width: 240px;
      margin: 0 auto;
      padding: 14px 18px;
      background: var(--chip-bg); color: var(--chip-text);
      border: none; border-radius: 6px;
      font-size: 11px; font-weight: 400; letter-spacing: 1.1px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit;
      box-shadow: 0 4px 6px -4px rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.1);
      transition: filter 0.15s, transform 0.1s;
    }
    .unload-btn:hover { filter: brightness(1.15); }
    .unload-btn:active { transform: scale(0.98); }

    /* ---------- 底部 Tab Bar ---------- */
    .tab-bar {
      display: flex; justify-content: space-around;
      padding: 12px 0 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin-top: auto;
      align-self: stretch; width: 100%;
      position: relative; z-index: 5;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none; color: var(--app-muted);
      font-size: 9px; cursor: pointer;
      transition: color 0.15s;
      font-family: inherit; letter-spacing: 0.05em; padding: 4px 10px;
    }
    .tab.active { color: var(--app-text); }
    .tab svg { width: 22px; height: 22px; }
    .tab:hover { color: var(--app-text); }

    /* Home indicator */
    .home-indicator {
      width: 110px; height: 4px;
      background: var(--app-text); opacity: 0.5;
      border-radius: 2px; margin: 0 auto 6px;
    }

    /* ---------- 选胶卷屏（Figma 精确还原） ---------- */
    .select-screen { padding: 0; }
    .select-top {
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 24px 24px 16px; width: 100%;
      position: relative; z-index: 5;
    }
    .select-title {
      font-size: 12px; color: var(--app-muted); letter-spacing: 1.2px; font-weight: 400;
    }
    .select-tabs {
      display: flex; gap: 22px;
      padding: 4px 24px 12px;
      font-size: 10px; font-weight: 400;
      letter-spacing: 1px;
      overflow-x: auto; scrollbar-width: none;
    }
    .select-tabs::-webkit-scrollbar { display: none; }
    .select-tab {
      color: var(--app-muted); cursor: pointer;
      padding-bottom: 8px; white-space: nowrap;
      border-bottom: 1.5px solid transparent;
      font-family: inherit; background: none; border-top: none; border-left: none; border-right: none;
    }
    .select-tab.active { color: #fff; border-bottom-color: #fff; }
    .film-list {
      flex: 1; overflow-y: auto;
      padding: 8px 18px 12px;
      display: flex; flex-direction: column; gap: 18px;
      scrollbar-width: thin; scrollbar-color: #333 transparent;
    }
    .film-list::-webkit-scrollbar { width: 4px; }
    .film-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .film-card {
      background: var(--app-card);
      border: 1px solid var(--app-border);
      border-radius: 8px; padding: 16px;
    }
    .film-card-head {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;
    }
    .film-card-name {
      font-size: 20px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.1;
    }
    .film-card-name.cinestill { color: var(--c-cinestill); }
    .film-card-name.gold { color: var(--c-gold); }
    .film-card-name.portra { color: var(--c-portra); }
    .film-card-name.velvia { color: var(--c-velvia); }
    .film-card-name.vision3 { color: var(--c-vision3); }
    .film-card-name.hp5 { color: var(--c-hp5); }
    .film-card-exp {
      font-size: 10px; color: var(--app-muted); letter-spacing: 1px; font-weight: 400; white-space: nowrap;
    }
    .film-tags { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .film-tag {
      font-size: 10px; padding: 4px 9px; border-radius: 4px;
      background: var(--chip-bg); color: var(--chip-text); letter-spacing: 0.5px; font-weight: 400;
    }
    .film-previews {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 4px; margin-bottom: 14px;
    }
    .film-preview {
      aspect-ratio: 1; border-radius: 3px;
      background-size: cover; background-position: center; position: relative; overflow: hidden;
    }
    .film-select-btn {
      width: 100%; padding: 12px; border: none; border-radius: 6px;
      font-size: 11px; font-weight: 700; letter-spacing: 1.1px;
      cursor: pointer; transition: filter 0.15s, transform 0.1s;
      font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .film-select-btn.cinestill { background: var(--c-cinestill); color: #fff; }
    .film-select-btn.gold { background: var(--c-gold); color: #000; }
    .film-select-btn.portra { background: var(--c-portra); color: #000; }
    .film-select-btn.velvia { background: var(--c-velvia); color: #fff; }
    .film-select-btn.vision3 { background: var(--c-vision3); color: #fff; }
    .film-select-btn.hp5 { background: var(--c-hp5); color: #000; }
    .film-select-btn:hover { filter: brightness(1.1); }
    .film-select-btn:active { transform: scale(0.98); }

    /* ---------- 冲扫中 ---------- */
    .develop-screen { align-items: center; justify-content: center; padding: 0 22px; }
    .develop-anim {
      width: 100px; height: 100px; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, var(--c-cinestill));
      animation: spin 1s linear infinite; margin-bottom: 24px; position: relative;
    }
    .develop-anim::after { content: ''; position: absolute; inset: 8px; background: var(--app-bg); border-radius: 50%; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .develop-text { font-size: 12px; letter-spacing: 1.2px; color: var(--app-text); font-weight: 700; }
    .develop-sub { font-size: 10px; color: var(--app-muted); margin-top: 10px; letter-spacing: 1px; font-weight: 400; }

    /* ---------- 胶卷条屏 ---------- */
    .strip-screen { padding: 0 18px; }
    .strip-header { display: flex; justify-content: space-between; align-items: center; padding: 24px 6px 14px; }
    .strip-title { text-align: center; flex: 1; }
    .strip-title .name {
      font-size: 20px; font-weight: 700; letter-spacing: 0.02em;
    }
    .strip-title .name.cinestill { color: var(--c-cinestill); }
    .strip-title .name.gold { color: var(--c-gold); }
    .strip-title .name.portra { color: var(--c-portra); }
    .strip-title .name.velvia { color: var(--c-velvia); }
    .strip-title .name.vision3 { color: var(--c-vision3); }
    .strip-title .name.hp5 { color: var(--c-hp5); }
    .strip-title .sub { font-size: 10px; color: var(--app-muted); margin-top: 4px; letter-spacing: 1px; }
    .strip-list {
      flex: 1; overflow-y: auto; padding: 4px 0 6px;
      display: flex; flex-direction: column; gap: 6px;
      scrollbar-width: thin; scrollbar-color: #333 transparent;
    }
    .strip-list::-webkit-scrollbar { width: 4px; }
    .strip-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .strip-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      background: #0a0a0a; border-radius: 4px; padding: 6px 8px; position: relative;
    }
    .frame {
      aspect-ratio: 3/2; border-radius: 2px; background-size: cover; background-position: center;
      position: relative; overflow: hidden; display: flex; flex-direction: column;
      justify-content: space-between; padding: 4px 4px 2px;
    }
    .frame-top {
      font-size: 6px; color: rgba(255,255,255,0.4); letter-spacing: 0.05em; line-height: 1;
      white-space: nowrap; overflow: hidden;
    }
    .frame-bottom {
      font-size: 7px; font-weight: 700; color: rgba(255,255,255,0.8); letter-spacing: 0.05em;
      line-height: 1; text-shadow: 0 1px 1px rgba(0,0,0,0.5); align-self: flex-end;
    }
    .frame.empty { background: #141414; display: flex; align-items: center; justify-content: center; padding: 0; }
    .frame.empty .frame-top, .frame.empty .frame-bottom { display: none; }
    .save-all-btn {
      margin: 10px auto 14px; padding: 10px 22px;
      background: #fff; color: #000; border: none; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer;
      display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 20px rgba(255,255,255,0.2);
      transition: transform 0.1s; font-family: inherit;
    }
    .save-all-btn:hover { transform: translateY(-1px); }
    .save-all-btn svg { width: 12px; height: 12px; }

    /* ---------- 暗房列表 ---------- */
    .darkroom-screen { padding: 0 18px; }
    .darkroom-header { display: flex; justify-content: space-between; align-items: center; padding: 24px 6px 16px; }
    .darkroom-select-btn {
      background: none; border: none; color: var(--app-muted); font-size: 11px;
      cursor: pointer; letter-spacing: 1px; font-weight: 400; font-family: inherit; padding: 6px 4px;
    }
    .darkroom-select-btn:hover { color: var(--app-text); }
    .darkroom-list {
      flex: 1; overflow-y: auto; padding: 0 4px 8px;
      display: flex; flex-direction: column; gap: 12px;
      scrollbar-width: thin; scrollbar-color: #333 transparent;
    }
    .darkroom-list::-webkit-scrollbar { width: 4px; }
    .darkroom-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .roll-card {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      background: var(--app-card); border: 1px solid var(--app-border);
      border-radius: 8px; cursor: pointer; transition: border-color 0.2s, transform 0.1s;
    }
    .roll-card:hover { border-color: #3a3633; transform: translateY(-1px); }
    .roll-thumb {
      width: 64px; height: 48px; border-radius: 6px;
      background-size: cover; background-position: center; flex-shrink: 0;
      position: relative; overflow: hidden;
    }
    .roll-info { flex: 1; min-width: 0; }
    .roll-name { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; }
    .roll-name.cinestill { color: var(--c-cinestill); }
    .roll-name.gold { color: var(--c-gold); }
    .roll-name.portra { color: var(--c-portra); }
    .roll-name.velvia { color: var(--c-velvia); }
    .roll-name.vision3 { color: var(--c-vision3); }
    .roll-name.hp5 { color: var(--c-hp5); }
    .roll-meta { font-size: 10px; color: var(--app-muted); margin-top: 4px; letter-spacing: 0.08em; font-weight: 400; }
    .roll-arrow { color: var(--app-muted); font-size: 18px; font-weight: 300; }
    .darkroom-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; color: var(--app-muted); font-size: 11px;
      letter-spacing: 0.2em; font-weight: 700; padding: 40px 20px; text-align: center;
    }
    .darkroom-empty svg { width: 40px; height: 40px; opacity: 0.3; }

    /* ---------- More 屏 ---------- */
    .more-screen { padding: 0 18px; align-items: stretch; }
    .more-section { padding: 12px 0; }
    .more-section-title {
      font-size: 10px; color: var(--app-muted); letter-spacing: 0.2em; font-weight: 700; margin-bottom: 10px;
    }
    .more-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid var(--app-border);
      font-size: 13px; cursor: pointer;
    }
    .more-row:hover { color: var(--c-cinestill); }
    .more-row-arrow { color: var(--app-muted); }


    /* ---------- 右半边：留言区 (1/3) ---------- */
    .comments { flex: 1; display: flex; flex-direction: column; background: var(--panel); overflow: hidden; }
    .comments__header { padding: 20px 22px; border-bottom: 1px solid var(--border); }
    .comments__header h2 { font-size: 16px; margin: 0; font-weight: 600; }
    .comments__header span { font-size: 12px; color: var(--muted); }
    .comments__list {
      flex: 1; overflow-y: auto; padding: 18px 22px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .comment { display: flex; gap: 12px; }
    .comment__avatar {
      flex: 0 0 36px; width: 36px; height: 36px;
      border-radius: 50%; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }
    .comment__body { flex: 1; }
    .comment__meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .comment__name { font-size: 14px; font-weight: 600; }
    .comment__time { font-size: 11px; color: var(--muted); }
    .comment__text {
      font-size: 14px; line-height: 1.55;
      color: var(--text); margin: 0; word-break: break-word;
    }
    .comment__empty {
      color: var(--muted); font-size: 13px;
      text-align: center; margin-top: 40px;
    }
    .comments__form {
      border-top: 1px solid var(--border);
      padding: 14px 18px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .comments__form input.name {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px;
      color: var(--text); font-size: 13px; outline: none;
    }
    .comments__form input.name:focus { border-color: var(--accent); }
    .comments__form .row { display: flex; gap: 10px; }
    .comments__form textarea {
      flex: 1; resize: none; height: 56px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px;
      color: var(--text); font-size: 14px;
      font-family: inherit; outline: none;
    }
    .comments__form textarea:focus { border-color: var(--accent); }
    .comments__form button {
      flex: 0 0 auto; align-self: stretch; padding: 0 18px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: filter 0.15s;
    }
    .comments__form button:hover { filter: brightness(1.08); }
    .comments__form button:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 900px) {
      .layout { flex-direction: column; height: auto; }
      .stage { flex: none; max-width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      body { overflow: auto; }
      .stage__body { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 左半边：展示区（直接手机画面） -->
    <section class="stage">
      <div class="stage__body">
        <!-- 手机交互 App -->
        <div class="card card--app">
          <div class="phone">
            <div class="phone__screen">
              <div class="phone__notch"></div>

              <!-- 屏幕 1: 相机主屏 -->
              <div class="screen camera-screen" id="screen-camera">
                <div class="cam-top">
                  <div class="cam-conn"><span class="dot"></span><span>Connected</span></div>
                  <div class="cam-fill">Fill Roll</div>
                </div>

                <button class="film-title-btn" id="film-title-btn">
                  <span class="film-title dim" id="film-title">选择风格</span>
                </button>

                <div class="ring-wrap">
                  <svg viewBox="0 0 224 224">
                    <circle class="ring-bg" cx="112" cy="112" r="106"/>
                    <circle class="ring-fg" id="ring-fg" cx="112" cy="112" r="106"
                      stroke-dasharray="665" stroke-dashoffset="665"/>
                  </svg>
                  <div class="ring-center">
                    <button class="ring-count" id="ring-count-btn">36</button>
                    <div class="ring-label">Left</div>
                  </div>
                </div>

                <button class="unload-btn" id="unload-btn">
                  <span id="unload-label">提前卸载</span>
                </button>

                <nav class="tab-bar">
                  <button class="tab active" data-tab="camera">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                      <path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/>
                    </svg>
                    CAMERA
                  </button>
                  <button class="tab" data-tab="darkroom">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                      <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-9 9"/>
                    </svg>
                    DARK ROOM
                  </button>
                  <button class="tab" data-tab="more">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                      <path d="M4 7h16M4 12h16M4 17h16"/>
                    </svg>
                    MORE
                  </button>
                </nav>
                <div class="home-indicator"></div>
              </div>

              <!-- 屏幕 2: 选胶卷 -->
              <div class="screen select-screen hidden" id="screen-select">
                <div class="select-top">
                  <div class="select-title">SELECT A STYLE</div>
                  <button class="back-btn" data-action="back-to-camera" style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--app-muted);cursor:pointer;font-family:inherit">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                  </button>
                </div>
                <div class="select-tabs">
                  <button class="select-tab active" data-cat="all">all</button>
                  <button class="select-tab" data-cat="bw">b&amp;w</button>
                  <button class="select-tab" data-cat="warm">warm</button>
                  <button class="select-tab" data-cat="cold">cold</button>
                  <button class="select-tab" data-cat="style">style</button>
                </div>
                <div class="film-list" id="film-list">
                  <!-- 动态生成 -->
                </div>
                <div class="home-indicator"></div>
              </div>

              <!-- 屏幕 3: 冲扫中 -->
              <div class="screen develop-screen hidden" id="screen-develop">
                <div class="develop-anim"></div>
                <div class="develop-text" id="develop-text">DEVELOPING</div>
                <div class="develop-sub" id="develop-sub">UNLOADING · 36 FRAMES</div>
              </div>

              <!-- 屏幕 4: 胶卷条 -->
              <div class="screen strip-screen hidden" id="screen-strip">
                <div class="strip-header">
                  <button class="back-btn" data-action="back-to-camera">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                  </button>
                  <div class="strip-title">
                    <div class="name" id="strip-film-name">CINESTILL 800T</div>
                    <div class="sub" id="strip-frame-count">36 张</div>
                  </div>
                  <div style="width:32px"></div>
                </div>
                <div class="strip-list" id="strip-list"></div>
                <button class="save-all-btn" id="save-all-btn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v12M7 11l5 5 5-5"/></svg>
                  SAVE ALL
                </button>
                <div class="home-indicator"></div>
              </div>

              <!-- 屏幕 5: 暗房列表 -->
              <div class="screen darkroom-screen hidden" id="screen-darkroom">
                <div class="darkroom-list" id="darkroom-list"></div>
                <nav class="tab-bar">
                  <button class="tab" data-tab="camera">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                      <path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/>
                    </svg>
                    CAMERA
                  </button>
                  <button class="tab active" data-tab="darkroom">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                      <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-9 9"/>
                    </svg>
                    DARK ROOM
                  </button>
                  <button class="tab" data-tab="more">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                      <path d="M4 7h16M4 12h16M4 17h16"/>
                    </svg>
                    MORE
                  </button>
                </nav>
                <div class="home-indicator"></div>
              </div>

              <!-- 屏幕 6: More -->
              <div class="screen more-screen hidden" id="screen-more">
                <div class="more-section" style="padding-top:28px">
                  <div class="more-section-title">SETTINGS</div>
                  <div class="more-row"><span>通知</span><span class="more-row-arrow">›</span></div>
                  <div class="more-row"><span>外观</span><span class="more-row-arrow">›</span></div>
                  <div class="more-row"><span>关于</span><span class="more-row-arrow">›</span></div>
                </div>
                <nav class="tab-bar">
                  <button class="tab" data-tab="camera">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                      <path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/>
                    </svg>
                    CAMERA
                  </button>
                  <button class="tab" data-tab="darkroom">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                      <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-9 9"/>
                    </svg>
                    DARK ROOM
                  </button>
                  <button class="tab active" data-tab="more">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                      <path d="M4 7h16M4 12h16M4 17h16"/>
                    </svg>
                    MORE
                  </button>
                </nav>
                <div class="home-indicator"></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- 右半边：留言区 -->
    <aside class="comments">
      <div class="comments__header">
        <h2>留言互动</h2>
        <span id="commentCount">还没有留言</span>
      </div>
      <div class="comments__list" id="commentList">
        <div class="comment__empty" id="emptyTip">成为第一个留言的人吧 👋</div>
      </div>
      <form class="comments__form" id="commentForm">
        <input class="name" id="nameInput" type="text" placeholder="你的昵称（可选）" maxlength="20" />
        <div class="row">
          <textarea id="textInput" placeholder="看完交互，留下你的想法…" maxlength="500"></textarea>
          <button type="submit" id="submitBtn">发送</button>
        </div>
      </form>
    </aside>
  </div>

  <script>
  // =================== 胶片相机 App 逻辑 ===================
  const FILMS = [
    {
      id: 'cinestill',
      name: 'CINESTILL 800T',
      cssClass: 'cinestill',
      tags: ['Tungsten', 'Halation', 'Cold'],
      cat: 'cold',
      exp: '36 EXP',
      previews: [
        'photos/日常/DSC_0673.jpg',
        'photos/日常/DSC_0666.jpg',
        'photos/日常/DSC_3840.jpg'
      ]
    },
    {
      id: 'gold',
      name: 'GOLD 200',
      cssClass: 'gold',
      tags: ['Warm', 'Vintage', 'Classic'],
      cat: 'warm',
      exp: '36 EXP',
      previews: [
        'photos/熟悉的地方/DSC_0180.jpg',
        'photos/熟悉的地方/DSC_0183.jpg',
        'photos/熟悉的地方/NIK_2009.jpg'
      ]
    },
    {
      id: 'hp5',
      name: 'HP5 Plus',
      cssClass: 'hp5',
      tags: ['B&W', 'High Contrast', 'Grainy'],
      cat: 'bw',
      exp: '36 EXP',
      previews: [
        'photos/黑白/DSC_0440.jpg',
        'photos/黑白/DSC_3546.jpg',
        'photos/黑白/NIK_1940.jpg'
      ]
    },
    {
      id: 'velvia',
      name: 'VELVIA 50',
      cssClass: 'velvia',
      tags: ['Vivid', 'Saturated', 'Landscape'],
      cat: 'style',
      exp: '36 EXP',
      previews: [
        'photos/城隍庙/DSC_0745.jpg',
        'photos/城隍庙/DSC_0770.jpg',
        'photos/城隍庙/DSC_0798.jpg'
      ]
    },
    {
      id: 'portra',
      name: 'PORTRA 400',
      cssClass: 'portra',
      tags: ['Natural', 'Skin Tone', 'Portrait'],
      cat: 'warm',
      exp: '36 EXP',
      previews: [
        'photos/熟悉的地方/DSC_0183.jpg',
        'photos/熟悉的地方/DSC_0180.jpg',
        'photos/小五郎/DSC_9035.jpg'
      ]
    },
    {
      id: 'vision3',
      name: 'VISION3 500T',
      cssClass: 'vision3',
      tags: ['Cinematic', 'Fine Grain', 'Cold'],
      cat: 'cold',
      exp: '36 EXP',
      previews: [
        'photos/日常/DSC_0666.jpg',
        'photos/日常/DSC_3840.jpg',
        'photos/小五郎/DSC_9035.jpg'
      ]
    }
  ];

  // 不同胶卷的色彩调色板（用于胶卷帧样片）
  const FILM_PALETTES = {
    cinestill: [
      ['#0a1f3d', '#e94560', '#1a1a2e'],
      ['#16213e', '#ff6b6b', '#533483'],
      ['#1a3a52', '#c83737', '#2a1b3d'],
      ['#2d1b4e', '#e94560', '#0f3460']
    ],
    gold: [
      ['#f4a261', '#e76f51', '#264653'],
      ['#f6c90e', '#e07a5f', '#3d2c2e'],
      ['#d4a574', '#b8845f', '#5c3d2e'],
      ['#f6bd60', '#f7ede2', '#84a59d']
    ],
    hp5: [
      ['#3a3a3a', '#9a9a9a', '#1a1a1a'],
      ['#555555', '#b0b0b0', '#2a2a2a'],
      ['#444444', '#8a8a8a', '#1e1e1e'],
      ['#666666', '#cccccc', '#333333']
    ],
    velvia: [
      ['#2d5a3d', '#f4a261', '#1a3a2e'],
      ['#1a6b3a', '#e07a5f', '#0d2818'],
      ['#3a7d44', '#f6bd60', '#1b3a2a'],
      ['#2e8b57', '#e8c547', '#143d2a']
    ]
  };

  function previewStyle(seed, filmId) {
    const palette = FILM_PALETTES[filmId] || FILM_PALETTES.cinestill;
    const idx = seed % palette.length;
    const [c1, c2, c3] = palette[idx];
    const angle = (seed * 47) % 360;
    return `linear-gradient(${angle}deg, ${c1} 0%, ${c2} 50%, ${c3} 100%)`;
  }

  // 暗房列表 —— 来自 photos 文件夹，每个文件夹一卷胶卷
  const PHOTO_ROLLS = [
    { folder: '小五郎', film: 'cinestill', cssClass: 'cinestill', name: 'CINESTILL 800T', count: 34,
      thumb: 'photos/小五郎/DSC_9035.jpg' },
    { folder: '日常', film: 'cinestill', cssClass: 'cinestill', name: 'CINESTILL 800T', count: 18,
      thumb: 'photos/日常/DSC_0673.jpg' },
    { folder: '熟悉的地方', film: 'gold', cssClass: 'gold', name: 'GOLD 200', count: 18,
      thumb: 'photos/熟悉的地方/DSC_0180.jpg' },
    { folder: '城隍庙', film: 'velvia', cssClass: 'velvia', name: 'Velvia 50', count: 26,
      thumb: 'photos/城隍庙/DSC_0745.jpg' },
    { folder: '黑白', film: 'hp5', cssClass: 'hp5', name: 'HP5 Plus', count: 14,
      thumb: 'photos/黑白/DSC_0440.jpg' }
  ];

  function formatDate(d) {
    const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    return `${d.getFullYear()}年${months[d.getMonth()]}${d.getDate()}日`;
  }

  // 暗房列表中也用对应的视觉色板
  const ROLL_THUMB_PALETTE = {
    velvia: [['#2d5a3d', '#f4a261', '#1a3a2e']],
    gold: [['#f4a261', '#e76f51', '#6b4423']],
    cinestill: [['#1a3a52', '#e94560', '#2a1b3d']],
    hp5: [['#3a3a3a', '#9a9a9a', '#1a1a1a']]
  };
  function rollThumbStyle(seed, filmId) {
    const palette = ROLL_THUMB_PALETTE[filmId] || ROLL_THUMB_PALETTE.cinestill;
    const [c1, c2, c3] = palette[0];
    const angle = (seed * 31) % 360;
    return `linear-gradient(${angle}deg, ${c1} 0%, ${c2} 50%, ${c3} 100%)`;
  }

  const STORAGE = {
    film: 'mc_film',
    shots: 'mc_shots',
    rolls: 'mc_rolls',
    sampleSeen: 'mc_sample_seen'
  };

  const state = {
    film: null,
    shots: 0,
    rolls: [],
    screen: 'camera',
    activeCat: 'all'
  };

  // 初始化
  try {
    const f = localStorage.getItem(STORAGE.film);
    if (f) state.film = JSON.parse(f);
    const s = localStorage.getItem(STORAGE.shots);
    if (s) state.shots = parseInt(s, 10) || 0;
    const r = localStorage.getItem(STORAGE.rolls);
    if (r) state.rolls = JSON.parse(r);
    // 首次访问用 photos 文件夹作为暗房预设
    if (!localStorage.getItem(STORAGE.sampleSeen)) {
      state.rolls = PHOTO_ROLLS.slice();
      localStorage.setItem(STORAGE.sampleSeen, '1');
      localStorage.setItem(STORAGE.rolls, JSON.stringify(state.rolls));
    }
  } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const RING_CIRCUMFERENCE = 2 * Math.PI * 106; // ≈ 665.7

  function save() {
    try {
      localStorage.setItem(STORAGE.film, JSON.stringify(state.film));
      localStorage.setItem(STORAGE.shots, String(state.shots));
      localStorage.setItem(STORAGE.rolls, JSON.stringify(state.rolls));
    } catch (e) {}
  }

  function showScreen(name) {
    ['camera', 'select', 'develop', 'strip', 'darkroom', 'more'].forEach(s => {
      $(`screen-${s}`).classList.toggle('hidden', s !== name);
    });
    state.screen = name;
  }

  function renderCamera() {
    const filmObj = state.film ? FILMS.find(f => f.id === state.film) : null;
    const title = $('film-title');
    title.textContent = filmObj ? filmObj.name : '选择风格';
    title.className = 'film-title' + (filmObj ? ' ' + filmObj.cssClass : ' dim');

    const remaining = 36 - state.shots;
    const countBtn = $('ring-count-btn');
    countBtn.textContent = String(remaining).padStart(2, '0');
    // 始终可点：未装卷→跳转选择，拍满→无操作
    countBtn.disabled = false;

    const ratio = state.shots / 36;
    const offset = RING_CIRCUMFERENCE * (1 - ratio);
    const ringFg = $('ring-fg');
    ringFg.setAttribute('stroke-dashoffset', offset);
    const RING_COLORS = {
      cinestill: '#E53935',
      gold: '#F6C83C',
      portra: '#FCD02C',
      velvia: '#008000',
      vision3: '#385E77',
      hp5: '#C9C9C9'
    };
    ringFg.style.stroke = filmObj ? (RING_COLORS[filmObj.id] || '#fff') : '#333';

    const unloadBtn = $('unload-btn');
    const unloadLabel = $('unload-label');
    unloadBtn.classList.remove('develop');
    if (!filmObj) {
      unloadBtn.disabled = true;
      unloadLabel.textContent = 'UNLOAD EARLY';
    } else if (state.shots >= 36) {
      unloadBtn.disabled = false;
      unloadBtn.classList.add('develop', filmObj.cssClass);
      unloadLabel.textContent = 'UNLOAD & DEVELOP';
    } else {
      unloadBtn.disabled = false;
      unloadLabel.textContent = 'UNLOAD EARLY';
    }

    // tab 高亮
    document.querySelectorAll('#screen-camera .tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === 'camera');
    });
  }

  function renderFilmList() {
    const list = $('film-list');
    list.innerHTML = '';
    FILMS.forEach(film => {
      const card = document.createElement('div');
      card.className = 'film-card';
      const previewsHTML = film.previews.map(url =>
        `<div class="film-preview" style="background-image:url(${url});background-size:cover;background-position:center"></div>`
      ).join('');
      card.innerHTML = `
        <div class="film-card-head">
          <div class="film-card-name ${film.cssClass}">${film.name}</div>
          <div class="film-card-exp">${film.exp}</div>
        </div>
        <div class="film-tags">
          ${film.tags.map(t => `<span class="film-tag">${t}</span>`).join('')}
        </div>
        <div class="film-previews">${previewsHTML}</div>
        <button class="film-select-btn ${film.cssClass}" data-film="${film.id}">
          SELECT
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      `;
      list.appendChild(card);
    });
  }

  function renderStrip() {
    if (!state.film) return;
    const filmObj = FILMS.find(f => f.id === state.film);
    $('strip-film-name').textContent = filmObj.name;
    $('strip-film-name').className = 'name ' + filmObj.cssClass;
    $('strip-frame-count').textContent = `${state.shots} FRAMES`;

    const list = $('strip-list');
    list.innerHTML = '';
    const total = 36;
    const rows = Math.ceil(total / 3);
    for (let r = 0; r < rows; r++) {
      const row = document.createElement('div');
      row.className = 'strip-row';
      for (let i = 0; i < 3; i++) {
        const idx = r * 3 + i;
        const taken = idx < state.shots;
        const mainNum = String(idx + 1).padStart(2, '0');
        const halfNum = `${mainNum}A`;
        // 用奇数帧放主编号、偶数帧放 A 编号，模拟 Figma 06 的双编号样式
        const label = (i === 0) ? mainNum : (i === 1 ? halfNum : mainNum);
        const frame = document.createElement('div');
        frame.className = 'frame' + (taken ? '' : ' empty');
        if (taken) {
          frame.style.background = previewStyle(idx + 1, state.film);
          frame.innerHTML = `
            <div class="frame-top">${mainNum}${filmObj.name.split(' ')[0]}</div>
            <div class="frame-bottom">${label}</div>
          `;
        }
        row.appendChild(frame);
      }
      list.appendChild(row);
    }
  }

  function renderDarkroom() {
    const list = $('darkroom-list');
    list.innerHTML = '';
    if (state.rolls.length === 0) {
      list.innerHTML = `
        <div class="darkroom-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <circle cx="9" cy="11" r="2"/>
            <path d="M21 16l-5-5-9 9"/>
          </svg>
          <div>NO SAVED ROLLS</div>
        </div>
      `;
      return;
    }
    state.rolls.slice().reverse().forEach(roll => {
      const card = document.createElement('div');
      card.className = 'roll-card';
      // 优先用照片缩略图，fallback 到色板
      const thumbBg = roll.thumb
        ? `background-image:url(${roll.thumb});background-size:cover;background-position:center`
        : `background:${rollThumbStyle(roll.firstSeed || 1, roll.film)}`;
      card.innerHTML = `
        <div class="roll-thumb" style="${thumbBg}"></div>
        <div class="roll-info">
          <div class="roll-name ${roll.cssClass}">${roll.name}</div>
          <div class="roll-meta">${roll.count || roll.shots} FRAMES</div>
        </div>
        <div class="roll-arrow">›</div>
      `;
      list.appendChild(card);
    });
  }

  function render() {
    renderCamera();
  }

  // =================== 事件绑定 ===================

  // 顶部标题 → 进入风格选择
  $('film-title-btn').addEventListener('click', () => {
    showScreen('select');
  });

  // 拍摄：点击进度圈中间的数字
  function takeShot() {
    if (!state.film) {
      // 未装卷：跳到选择页
      showScreen('select');
      return;
    }
    if (state.shots >= 36) return;
    state.shots += 1;
    save();
    render();
    // 闪光动效
    const flash = document.createElement('div');
    Object.assign(flash.style, {
      position: 'fixed', inset: '0',
      background: '#fff', opacity: '0.7',
      pointerEvents: 'none', zIndex: '9999',
      transition: 'opacity 0.18s'
    });
    document.body.appendChild(flash);
    requestAnimationFrame(() => { flash.style.opacity = '0'; });
    setTimeout(() => flash.remove(), 200);

    if (state.shots >= 36) {
      setTimeout(() => developFilm(), 350);
    }
  }
  $('ring-count-btn').addEventListener('click', takeShot);

  // 卸载 / 冲扫按钮
  $('unload-btn').addEventListener('click', () => {
    if (!state.film) return;
    developFilm();
  });

  // 选胶卷返回
  document.querySelectorAll('[data-action="back-to-camera"]').forEach(b => {
    b.addEventListener('click', () => showScreen('camera'));
  });

  // 选胶卷 - 分类切换
  document.querySelectorAll('.select-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.select-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      state.activeCat = tab.dataset.cat;
      const cards = document.querySelectorAll('.film-card');
      cards.forEach(c => {
        const filmId = c.querySelector('[data-film]').dataset.film;
        const film = FILMS.find(f => f.id === filmId);
        const match = state.activeCat === 'all' || film.cat === state.activeCat;
        c.style.display = match ? 'block' : 'none';
      });
    });
  });

  // 选胶卷 - 选择按钮
  $('film-list').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-film]');
    if (!btn) return;
    state.film = btn.dataset.film;
    state.shots = 0; // 装入新胶卷清零
    save();
    showScreen('camera');
    render();
  });

  // 标签栏切换
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      if (target === 'camera') {
        showScreen('camera');
        render();
      } else if (target === 'darkroom') {
        showScreen('darkroom');
        renderDarkroom();
        document.querySelectorAll('#screen-darkroom .tab').forEach(t => {
          t.classList.toggle('active', t.dataset.tab === 'darkroom');
        });
      } else if (target === 'more') {
        showScreen('more');
      }
    });
  });

  // 冲扫流程
  function developFilm() {
    if (!state.film || state.shots === 0) return;
    const filmObj = FILMS.find(f => f.id === state.film);
    const sub = $('develop-sub');
    sub.textContent = `UNLOADING · ${state.shots} FRAMES`;
    showScreen('develop');
    setTimeout(() => {
      showScreen('strip');
      renderStrip();
    }, 1800);
  }

  // 保存全部到暗房
  $('save-all-btn').addEventListener('click', () => {
    if (!state.film || state.shots === 0) return;
    const filmObj = FILMS.find(f => f.id === state.film);
    state.rolls.push({
      film: state.film,
      cssClass: filmObj.cssClass,
      name: filmObj.name,
      shots: state.shots,
      firstSeed: Math.floor(Math.random() * 20) + 1,
      dateStr: formatDate(new Date())
    });
    // 重置
    state.film = null;
    state.shots = 0;
    save();
    showScreen('camera');
    render();
  });

  // 初始化
  renderFilmList();
  render();

  // =================== 留言板逻辑 ===================
  const COMMENTS_KEY = "myconcepts_comments_v1";
  const listEl = document.getElementById("commentList");
  const emptyTip = document.getElementById("emptyTip");
  const countEl = document.getElementById("commentCount");
  const form = document.getElementById("commentForm");
  const nameInput = document.getElementById("nameInput");
  const textInput = document.getElementById("textInput");

  function loadComments() {
    try { return JSON.parse(localStorage.getItem(COMMENTS_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveComments(arr) {
    localStorage.setItem(COMMENTS_KEY, JSON.stringify(arr));
  }
  function timeAgo(ts) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return "刚刚";
    if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
    if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
    const d = new Date(ts);
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function renderComments() {
    const arr = loadComments().slice().reverse();
    listEl.innerHTML = "";
    if (arr.length === 0) {
      listEl.appendChild(emptyTip);
      countEl.textContent = "还没有留言";
      return;
    }
    countEl.textContent = `共 ${arr.length} 条留言`;
    arr.forEach((c) => {
      const wrap = document.createElement("div");
      wrap.className = "comment";
      const initial = (c.name || "匿").trim().charAt(0).toUpperCase();
      wrap.innerHTML = `
        <div class="comment__avatar">${escapeHtml(initial)}</div>
        <div class="comment__body">
          <div class="comment__meta">
            <span class="comment__name">${escapeHtml(c.name || "匿名")}</span>
            <span class="comment__time">${timeAgo(c.ts)}</span>
          </div>
          <p class="comment__text">${escapeHtml(c.text)}</p>
        </div>`;
      listEl.appendChild(wrap);
    });
  }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text) return;
    const arr = loadComments();
    arr.push({ name: nameInput.value.trim(), text: text, ts: Date.now() });
    saveComments(arr);
    textInput.value = "";
    renderComments();
  });
  renderComments();
  </script>
</body>
</html>
