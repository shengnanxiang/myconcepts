<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyConcepts · 开发中</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f242e;
      --border: #2a303c;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --accent: #6c8cff;
      --accent-2: #ff7a59;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .layout {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* ---------- 左半边：展示区 (2/3) ---------- */
    .stage {
      flex: 0 0 66.6667%;
      max-width: 66.6667%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .stage__header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stage__header h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
    }
    .badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 122, 89, 0.15);
      color: var(--accent-2);
      border: 1px solid rgba(255, 122, 89, 0.3);
    }
    .stage__body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 28px;
      overflow: auto;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
    }
    .card__title {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }
    .phone {
      flex: 1;
      min-height: 420px;
      border-radius: 22px;
      background: linear-gradient(160deg, #20283a, #141823);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .phone__placeholder {
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }
    .phone__placeholder .dot {
      width: 54px; height: 54px;
      border-radius: 50%;
      margin: 0 auto 14px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .phone__placeholder p { margin: 6px 0; font-size: 13px; }
    .output {
      flex: 1;
      min-height: 420px;
      border-radius: 14px;
      background: var(--panel-2)
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%231f242e'/><path d='M0 20h40M20 0v40' stroke='%232a303c' stroke-width='1'/></svg>");
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 24px;
    }

    /* ---------- 右半边：留言区 (1/3) ---------- */
    .comments {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      overflow: hidden;
    }
    .comments__header {
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
    }
    .comments__header h2 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
    }
    .comments__header span {
      font-size: 12px;
      color: var(--muted);
    }
    .comments__list {
      flex: 1;
      overflow-y: auto;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .comment {
      display: flex;
      gap: 12px;
    }
    .comment__avatar {
      flex: 0 0 36px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }
    .comment__body { flex: 1; }
    .comment__meta {
      display: flex; align-items: baseline; gap: 8px;
      margin-bottom: 4px;
    }
    .comment__name { font-size: 14px; font-weight: 600; }
    .comment__time { font-size: 11px; color: var(--muted); }
    .comment__text {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text);
      margin: 0;
      word-break: break-word;
    }
    .comment__empty {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      margin-top: 40px;
    }
    .comments__form {
      border-top: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .comments__form input.name {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .comments__form input.name:focus { border-color: var(--accent); }
    .comments__form .row {
      display: flex;
      gap: 10px;
    }
    .comments__form textarea {
      flex: 1;
      resize: none;
      height: 56px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .comments__form textarea:focus { border-color: var(--accent); }
    .comments__form button {
      flex: 0 0 auto;
      align-self: stretch;
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .comments__form button:hover { filter: brightness(1.08); }
    .comments__form button:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 900px) {
      .layout { flex-direction: column; height: auto; }
      .stage { flex: none; max-width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      body { overflow: auto; }
      .stage__body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 左半边：展示区 -->
    <section class="stage">
      <div class="stage__header">
        <h1>MyConcepts</h1>
        <span class="badge">开发中 · Demo</span>
      </div>
      <div class="stage__body">
        <!-- 手机交互 App -->
        <div class="card">
          <div class="card__title">App 交互预览</div>
          <div class="phone">
            <div class="phone__placeholder">
              <div class="dot">📱</div>
              <p>手机交互 App</p>
              <p>此处将展示 Figma 设计的交互流程<br>（拍照 → AI 生成 → 输出）</p>
            </div>
          </div>
        </div>
        <!-- 输出照片效果 -->
        <div class="card">
          <div class="card__title">最终输出照片</div>
          <div class="output">AI 生成的最终照片效果将展示在这里</div>
        </div>
      </div>
    </section>

    <!-- 右半边：留言区 -->
    <aside class="comments">
      <div class="comments__header">
        <h2>留言互动</h2>
        <span id="commentCount">还没有留言</span>
      </div>
      <div class="comments__list" id="commentList">
        <div class="comment__empty" id="emptyTip">成为第一个留言的人吧 👋</div>
      </div>
      <form class="comments__form" id="commentForm">
        <input class="name" id="nameInput" type="text" placeholder="你的昵称（可选）" maxlength="20" />
        <div class="row">
          <textarea id="textInput" placeholder="看完交互，留下你的想法…" maxlength="500"></textarea>
          <button type="submit" id="submitBtn">发送</button>
        </div>
      </form>
    </aside>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "myconcepts_comments_v1";
      const listEl = document.getElementById("commentList");
      const emptyTip = document.getElementById("emptyTip");
      const countEl = document.getElementById("commentCount");
      const form = document.getElementById("commentForm");
      const nameInput = document.getElementById("nameInput");
      const textInput = document.getElementById("textInput");
      const submitBtn = document.getElementById("submitBtn");

      function load() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch (e) {
          return [];
        }
      }
      function save(arr) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
      }
      function timeAgo(ts) {
        const diff = Math.floor((Date.now() - ts) / 1000);
        if (diff < 60) return "刚刚";
        if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
        if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
        const d = new Date(ts);
        return `${d.getMonth() + 1}月${d.getDate()}日`;
      }
      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
      }
      function render() {
        const arr = load().slice().reverse();
        listEl.innerHTML = "";
        if (arr.length === 0) {
          listEl.appendChild(emptyTip);
          countEl.textContent = "还没有留言";
          return;
        }
        countEl.textContent = `共 ${arr.length} 条留言`;
        arr.forEach((c) => {
          const wrap = document.createElement("div");
          wrap.className = "comment";
          const initial = (c.name || "匿").trim().charAt(0).toUpperCase();
          wrap.innerHTML = `
            <div class="comment__avatar">${escapeHtml(initial)}</div>
            <div class="comment__body">
              <div class="comment__meta">
                <span class="comment__name">${escapeHtml(c.name || "匿名")}</span>
                <span class="comment__time">${timeAgo(c.ts)}</span>
              </div>
              <p class="comment__text">${escapeHtml(c.text)}</p>
            </div>`;
          listEl.appendChild(wrap);
        });
      }
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const text = textInput.value.trim();
        if (!text) return;
        const arr = load();
        arr.push({
          name: nameInput.value.trim(),
          text: text,
          ts: Date.now()
        });
        save(arr);
        textInput.value = "";
        render();
      });
      render();
    })();
  </script>
</body>
</html>
