<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyConcepts · 等待3小时冲扫的意义</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f242e;
      --border: #2a303c;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --accent: #6c8cff;
      --accent-2: #ff7a59;
      --radius: 14px;

      /* 胶片 App 主题色 */
      --phone-frame-1: #d49275;
      --phone-frame-2: #a06850;
      --app-bg: #000000;
      --app-text: #ffffff;
      --app-muted: #6c6c70;
      --app-muted-2: #444444;
      --app-card: #0a0a0a;
      --app-border: #1a1a1a;
      --green: #4ade80;
      --red: #ef4444;
      --yellow: #fbbf24;
      --velvia: #4ade80;
      --hp5: #d1d5db;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .layout { display: flex; height: 100vh; width: 100%; }

    /* ---------- 左半边：展示区 (2/3) ---------- */
    .stage {
      flex: 0 0 66.6667%;
      max-width: 66.6667%;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .stage__header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .stage__header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .badge {
      font-size: 12px; padding: 3px 10px; border-radius: 999px;
      background: rgba(255, 122, 89, 0.15);
      color: var(--accent-2);
      border: 1px solid rgba(255, 122, 89, 0.3);
    }
    .stage__body {
      flex: 1;
      display: flex;
      padding: 28px;
      overflow: hidden;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex; flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    /* App 交互卡片：无标题，手机居中 */
    .card--app {
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 0;
    }
    .card__title {
      font-size: 13px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    /* ---------- 手机外壳 ---------- */
    /* 用高度反推宽度：iPhone 14 Pro 比例 390:844，padding 8px×2 + border 余量 */
    .phone {
      flex: 0 0 auto;
      height: 100%;
      max-height: 100%;
      aspect-ratio: 390 / 844;
      border-radius: 36px;
      padding: 8px;
      background: linear-gradient(155deg, var(--phone-frame-1), var(--phone-frame-2));
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.08);
      display: flex;
    }
    .phone__screen {
      flex: 1;
      border-radius: 28px;
      background: var(--app-bg);
      color: var(--app-text);
      position: relative;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .phone__notch {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 26px;
      background: #000; border-radius: 14px; z-index: 10;
    }

    /* ---------- App 屏幕通用 ---------- */
    .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
    .screen.hidden { display: none; }

    /* ---------- App 状态栏 ---------- */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 22px 8px;
      font-size: 13px; font-weight: 600;
      letter-spacing: 0.02em;
      position: relative; z-index: 5;
    }
    .status-bar .right { display: flex; gap: 6px; align-items: center; }
    .status-bar svg { width: 16px; height: 11px; }

    /* ---------- 连接状态 ---------- */
    .conn {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 22px 14px;
      font-size: 10px; font-weight: 700;
      color: var(--app-muted); letter-spacing: 0.18em;
      position: relative; z-index: 5;
    }
    .conn .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
    }

    /* ---------- 相机主屏 ---------- */
    .camera-screen { align-items: center; }

    /* 标题按钮（点击进入风格选择） */
    .film-title-btn {
      background: none; border: none; padding: 6px 22px;
      font-family: inherit; cursor: pointer;
      width: 100%; max-width: 280px;
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 5;
    }
    .film-title {
      font-size: 15px; font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--app-text);
      text-align: center;
    }
    .film-title.cinestill { color: var(--red); }
    .film-title.gold { color: var(--yellow); }
    .film-title.hp5 { color: #d1d5db; }
    .film-title.velvia { color: #4ade80; }
    .film-title.dim { color: var(--app-muted); }

    /* 环形进度 */
    .ring-wrap {
      position: relative;
      width: 200px; height: 200px;
      margin: 22px 0 26px;
    }
    .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
    .ring-bg { fill: none; stroke: #1a1a1a; stroke-width: 4; }
    .ring-fg {
      fill: none; stroke-width: 4; stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease, stroke 0.3s;
    }
    .ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px;
    }
    .ring-count {
      font-size: 56px; font-weight: 300; line-height: 1;
      letter-spacing: -0.02em;
      background: none; border: none; color: var(--app-text);
      font-family: inherit; padding: 4px 18px;
      cursor: pointer; border-radius: 8px;
      transition: background 0.15s;
    }
    .ring-count:not(:disabled):hover { background: rgba(255,255,255,0.04); }
    .ring-count:disabled { cursor: default; }
    .ring-label {
      font-size: 9px; letter-spacing: 0.3em;
      color: var(--app-muted); font-weight: 600;
    }

    /* 卸载按钮 */
    .unload-btn {
      width: 100%; max-width: 240px;
      padding: 13px 18px;
      background: #1a1a1a; color: #666;
      border: none; border-radius: 10px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.2em;
      cursor: not-allowed;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .unload-btn svg { width: 13px; height: 13px; }
    .unload-btn.ready {
      background: #1a1a1a; color: #999; cursor: pointer;
    }
    .unload-btn.ready:hover { background: #222; }
    .unload-btn.develop {
      background: var(--red); color: #fff; cursor: pointer;
    }
    .unload-btn.develop.cinestill { background: var(--red); }
    .unload-btn.develop.gold { background: var(--yellow); color: #000; }
    .unload-btn.develop.hp5 { background: #d1d5db; color: #000; }
    .unload-btn.develop.velvia { background: #4ade80; color: #000; }
    .unload-btn.develop:hover { filter: brightness(1.1); }

    /* ---------- 底部 Tab Bar ---------- */
    .tab-bar {
      display: flex; justify-content: space-around;
      padding: 12px 0 16px;
      border-top: 1px solid #141414;
      margin-top: auto;
      align-self: stretch; width: 100%;
      position: relative; z-index: 5;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none; color: var(--app-muted);
      font-size: 9px; cursor: pointer;
      transition: color 0.15s;
      font-family: inherit; letter-spacing: 0.05em;
      padding: 4px 10px;
    }
    .tab.active { color: var(--app-text); }
    .tab svg { width: 22px; height: 22px; }
    .tab:hover { color: var(--app-text); }

    /* Home indicator */
    .home-indicator {
      width: 110px; height: 4px;
      background: var(--app-text); opacity: 0.5;
      border-radius: 2px;
      margin: 0 auto 6px;
    }

    /* ---------- 选胶卷屏 ---------- */
    .select-screen { padding: 0 0 0; }
    .select-header {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 6px 10px;
    }
    .back-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; color: var(--app-text);
      cursor: pointer; border-radius: 50%;
      font-family: inherit;
    }
    .back-btn:hover { background: #1a1a1a; }
    .select-tabs {
      display: flex; gap: 20px;
      padding: 4px 18px 14px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.18em;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .select-tabs::-webkit-scrollbar { display: none; }
    .select-tab {
      color: var(--app-muted); cursor: pointer;
      padding-bottom: 8px; white-space: nowrap;
      border-bottom: 2px solid transparent;
      font-family: inherit; background: none; border-top: none; border-left: none; border-right: none;
    }
    .select-tab.active { color: var(--app-text); border-bottom-color: var(--app-text); }
    .film-list {
      flex: 1; overflow-y: auto;
      padding: 4px 14px 8px;
      display: flex; flex-direction: column; gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    .film-list::-webkit-scrollbar { width: 4px; }
    .film-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .film-card {
      background: var(--app-card);
      border: 1px solid var(--app-border);
      border-radius: 12px;
      padding: 14px;
      transition: border-color 0.2s;
    }
    .film-card:hover { border-color: #2a2a2a; }
    .film-card-head {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 10px;
    }
    .film-card-name {
      font-size: 19px; font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.1;
      font-family: 'Courier New', monospace;
    }
    .film-card-name.cinestill { color: var(--red); }
    .film-card-name.gold { color: var(--yellow); }
    .film-card-name.hp5 { color: #d1d5db; }
    .film-card-name.velvia { color: #4ade80; }
    .film-card-exp {
      font-size: 9px; color: var(--app-muted);
      letter-spacing: 0.15em; font-weight: 700;
    }
    .film-tags { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .film-tag {
      font-size: 9px; padding: 4px 9px;
      border-radius: 4px;
      background: #1a1a1a; color: #999;
      letter-spacing: 0.12em; font-weight: 700;
    }
    .film-previews {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 4px; margin-bottom: 12px;
    }
    .film-preview {
      aspect-ratio: 1;
      border-radius: 4px;
      background-size: cover; background-position: center;
      position: relative; overflow: hidden;
    }
    .film-preview::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg,
        rgba(255,255,255,0.08) 0%,
        rgba(0,0,0,0.2) 50%,
        rgba(0,0,0,0.4) 100%);
    }
    .film-select-btn {
      width: 100%; padding: 11px;
      border: none; border-radius: 6px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .film-select-btn.cinestill { background: var(--red); color: #fff; }
    .film-select-btn.gold { background: var(--yellow); color: #000; }
    .film-select-btn.hp5 { background: #d1d5db; color: #000; }
    .film-select-btn.velvia { background: #4ade80; color: #000; }
    .film-select-btn:hover { filter: brightness(1.1); }
    .film-select-btn:active { transform: scale(0.98); }

    /* ---------- 冲扫中 ---------- */
    .develop-screen {
      align-items: center; justify-content: center;
      padding: 0 22px;
    }
    .develop-anim {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, var(--red));
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
      position: relative;
    }
    .develop-anim::after {
      content: ''; position: absolute; inset: 8px;
      background: var(--app-bg); border-radius: 50%;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .develop-text {
      font-size: 12px; letter-spacing: 0.3em;
      color: var(--app-text); font-weight: 700;
    }
    .develop-sub {
      font-size: 10px; color: var(--app-muted);
      margin-top: 10px; letter-spacing: 0.18em; font-weight: 600;
    }

    /* ---------- 胶卷条屏 ---------- */
    .strip-screen { padding: 0 14px; }
    .strip-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 6px 10px;
    }
    .strip-title {
      text-align: center; flex: 1;
    }
    .strip-title .name {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.18em;
      font-family: 'Courier New', monospace;
    }
    .strip-title .name.cinestill { color: var(--red); }
    .strip-title .name.gold { color: var(--yellow); }
    .strip-title .name.hp5 { color: #d1d5db; }
    .strip-title .name.velvia { color: #4ade80; }
    .strip-title .sub {
      font-size: 9px; color: var(--app-muted);
      margin-top: 4px; letter-spacing: 0.15em; font-weight: 700;
    }
    .strip-empty {
      width: 24px; height: 24px;
      border: 1px solid var(--app-muted);
      border-radius: 4px;
      background: none;
    }
    .strip-list {
      flex: 1; overflow-y: auto;
      padding: 4px 4px 6px;
      display: flex; flex-direction: column; gap: 6px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    .strip-list::-webkit-scrollbar { width: 4px; }
    .strip-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .strip-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #0a0a0a;
      border-radius: 4px;
      padding: 6px 8px;
      position: relative;
    }
    .frame {
      aspect-ratio: 3/2;
      border-radius: 2px;
      background-size: cover; background-position: center;
      position: relative;
      overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 4px 4px 2px;
    }
    .frame-top {
      font-size: 6px; color: rgba(255,255,255,0.4);
      font-family: 'Courier New', monospace;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap; overflow: hidden;
    }
    .frame-bottom {
      font-size: 7px; font-weight: 700;
      color: rgba(255,255,255,0.8);
      letter-spacing: 0.05em;
      line-height: 1;
      text-shadow: 0 1px 1px rgba(0,0,0,0.5);
      align-self: flex-end;
    }
    .frame.empty {
      background: #141414;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
    }
    .frame.empty .frame-top,
    .frame.empty .frame-bottom { display: none; }
    .save-all-btn {
      margin: 10px auto 14px;
      padding: 10px 22px;
      background: #fff; color: #000;
      border: none; border-radius: 999px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 20px rgba(255,255,255,0.2);
      transition: transform 0.1s;
      font-family: inherit;
    }
    .save-all-btn:hover { transform: translateY(-1px); }
    .save-all-btn svg { width: 12px; height: 12px; }

    /* ---------- 暗房列表 ---------- */
    .darkroom-screen { padding: 0 14px; }
    .darkroom-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 4px 14px;
    }
    .darkroom-select-btn {
      background: none; border: none;
      color: var(--app-muted); font-size: 11px;
      cursor: pointer; letter-spacing: 0.18em; font-weight: 700;
      font-family: inherit;
      padding: 6px 4px;
    }
    .darkroom-select-btn:hover { color: var(--app-text); }
    .darkroom-list {
      flex: 1; overflow-y: auto;
      padding: 0 4px 8px;
      display: flex; flex-direction: column; gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    .darkroom-list::-webkit-scrollbar { width: 4px; }
    .darkroom-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .roll-card {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      background: var(--app-card);
      border: 1px solid var(--app-border);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }
    .roll-card:hover { border-color: #2a2a2a; transform: translateY(-1px); }
    .roll-thumb {
      width: 64px; height: 48px;
      border-radius: 6px;
      background-size: cover; background-position: center;
      flex-shrink: 0;
      position: relative; overflow: hidden;
    }
    .roll-thumb::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg,
        rgba(255,255,255,0.08) 0%,
        rgba(0,0,0,0.3) 100%);
    }
    .roll-info { flex: 1; min-width: 0; }
    .roll-name {
      font-size: 14px; font-weight: 700;
      letter-spacing: 0.04em;
      font-family: 'Courier New', monospace;
    }
    .roll-name.cinestill { color: var(--red); }
    .roll-name.gold { color: var(--yellow); }
    .roll-name.velvia { color: var(--velvia); }
    .roll-name.hp5 { color: var(--hp5); }
    .roll-meta {
      font-size: 10px; color: var(--app-muted);
      margin-top: 4px; letter-spacing: 0.08em; font-weight: 600;
    }
    .roll-arrow { color: var(--app-muted); font-size: 18px; font-weight: 300; }
    .darkroom-empty {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      color: var(--app-muted); font-size: 11px;
      letter-spacing: 0.2em; font-weight: 700;
      padding: 40px 20px;
      text-align: center;
    }
    .darkroom-empty svg { width: 40px; height: 40px; opacity: 0.3; }

    /* ---------- More 屏 ---------- */
    .more-screen {
      padding: 0 18px;
      align-items: stretch;
    }
    .more-section { padding: 12px 0; }
    .more-section-title {
      font-size: 10px; color: var(--app-muted);
      letter-spacing: 0.2em; font-weight: 700;
      margin-bottom: 10px;
    }
    .more-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--app-border);
      font-size: 13px;
      cursor: pointer;
    }
    .more-row:hover { color: var(--red); }
    .more-row-arrow { color: var(--app-muted); }


    /* ---------- 右半边：留言区 (1/3) ---------- */
    .comments { flex: 1; display: flex; flex-direction: column; background: var(--panel); overflow: hidden; }
    .comments__header { padding: 20px 22px; border-bottom: 1px solid var(--border); }
    .comments__header h2 { font-size: 16px; margin: 0; font-weight: 600; }
    .comments__header span { font-size: 12px; color: var(--muted); }
    .comments__list {
      flex: 1; overflow-y: auto; padding: 18px 22px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .comment { display: flex; gap: 12px; }
    .comment__avatar {
      flex: 0 0 36px; width: 36px; height: 36px;
      border-radius: 50%; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }
    .comment__body { flex: 1; }
    .comment__meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .comment__name { font-size: 14px; font-weight: 600; }
    .comment__time { font-size: 11px; color: var(--muted); }
    .comment__text {
      font-size: 14px; line-height: 1.55;
      color: var(--text); margin: 0; word-break: break-word;
    }
    .comment__empty {
      color: var(--muted); font-size: 13px;
      text-align: center; margin-top: 40px;
    }
    .comments__form {
      border-top: 1px solid var(--border);
      padding: 14px 18px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .comments__form input.name {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px;
      color: var(--text); font-size: 13px; outline: none;
    }
    .comments__form input.name:focus { border-color: var(--accent); }
    .comments__form .row { display: flex; gap: 10px; }
    .comments__form textarea {
      flex: 1; resize: none; height: 56px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px;
      color: var(--text); font-size: 14px;
      font-family: inherit; outline: none;
    }
    .comments__form textarea:focus { border-color: var(--accent); }
    .comments__form button {

  <script>
  // =================== 胶片相机 App 逻辑 ===================
  const FILMS = [
    {
      id: 'cinestill',
      name: 'CINESTILL 800T',
      cssClass: 'cinestill',
      tags: ['钨丝灯', '光晕', '冷调'],
      cat: 'cold',
      exp: '36 张',
      previews: [
        'photos/日常/DSC_0673.jpg',
        'photos/日常/DSC_0666.jpg',
        'photos/日常/DSC_3840.jpg'
      ]
    },
    {
      id: 'gold',
      name: 'GOLD 200',
      cssClass: 'gold',
      tags: ['暖调', '复古', '经典'],
      cat: 'warm',
      exp: '36 张',
      previews: [
        'photos/熟悉的地方/DSC_0180.jpg',
        'photos/熟悉的地方/DSC_0183.jpg',
        'photos/熟悉的地方/NIK_2009.jpg'
      ]
    },
    {
      id: 'hp5',
      name: 'HP5 Plus',
      cssClass: 'hp5',
      tags: ['黑白', '高反差', '经典'],
      cat: 'bw',
      exp: '36 张',
      previews: [
        'photos/黑白/DSC_0440.jpg',
        'photos/黑白/DSC_3546.jpg',
        'photos/黑白/NIK_1940.jpg'
      ]
    },
    {
      id: 'velvia',
      name: 'Velvia 50',
      cssClass: 'velvia',
      tags: ['高饱和', '风光', '鲜艳'],
      cat: 'style',
      exp: '36 张',
      previews: [
        'photos/城隍庙/DSC_0745.jpg',
        'photos/城隍庙/DSC_0770.jpg',
        'photos/城隍庙/DSC_0798.jpg'
      ]
    }
  ];

  // 不同胶卷的色彩调色板（用于胶卷帧样片）
  const FILM_PALETTES = {
    cinestill: [
      ['#0a1f3d', '#e94560', '#1a1a2e'],
      ['#16213e', '#ff6b6b', '#533483'],
      ['#1a3a52', '#c83737', '#2a1b3d'],
      ['#2d1b4e', '#e94560', '#0f3460']
    ],
    gold: [
      ['#f4a261', '#e76f51', '#264653'],
      ['#f6c90e', '#e07a5f', '#3d2c2e'],
      ['#d4a574', '#b8845f', '#5c3d2e'],
      ['#f6bd60', '#f7ede2', '#84a59d']
    ],
    hp5: [
      ['#3a3a3a', '#9a9a9a', '#1a1a1a'],
      ['#555555', '#b0b0b0', '#2a2a2a'],
      ['#444444', '#8a8a8a', '#1e1e1e'],
      ['#666666', '#cccccc', '#333333']
    ],
    velvia: [
      ['#2d5a3d', '#f4a261', '#1a3a2e'],
      ['#1a6b3a', '#e07a5f', '#0d2818'],
      ['#3a7d44', '#f6bd60', '#1b3a2a'],
      ['#2e8b57', '#e8c547', '#143d2a']
    ]
  };

  function previewStyle(seed, filmId) {
    const palette = FILM_PALETTES[filmId] || FILM_PALETTES.cinestill;
    const idx = seed % palette.length;
    const [c1, c2, c3] = palette[idx];
    const angle = (seed * 47) % 360;
    return `linear-gradient(${angle}deg, ${c1} 0%, ${c2} 50%, ${c3} 100%)`;
  }

  // 暗房列表 —— 来自 photos 文件夹，每个文件夹一卷胶卷
  const PHOTO_ROLLS = [
    { folder: '小五郎', film: 'cinestill', cssClass: 'cinestill', name: 'CINESTILL 800T', count: 34,
      thumb: 'photos/小五郎/DSC_9035.jpg' },
    { folder: '日常', film: 'cinestill', cssClass: 'cinestill', name: 'CINESTILL 800T', count: 18,
      thumb: 'photos/日常/DSC_0673.jpg' },
    { folder: '熟悉的地方', film: 'gold', cssClass: 'gold', name: 'GOLD 200', count: 18,
      thumb: 'photos/熟悉的地方/DSC_0180.jpg' },
    { folder: '城隍庙', film: 'velvia', cssClass: 'velvia', name: 'Velvia 50', count: 26,
      thumb: 'photos/城隍庙/DSC_0745.jpg' },
    { folder: '黑白', film: 'hp5', cssClass: 'hp5', name: 'HP5 Plus', count: 14,
      thumb: 'photos/黑白/DSC_0440.jpg' }
  ];

  function formatDate(d) {
    const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    return `${d.getFullYear()}年${months[d.getMonth()]}${d.getDate()}日`;
  }

  // 暗房列表中也用对应的视觉色板
  const ROLL_THUMB_PALETTE = {
    velvia: [['#2d5a3d', '#f4a261', '#1a3a2e']],
    gold: [['#f4a261', '#e76f51', '#6b4423']],
    cinestill: [['#1a3a52', '#e94560', '#2a1b3d']],
    hp5: [['#3a3a3a', '#9a9a9a', '#1a1a1a']]
  };
  function rollThumbStyle(seed, filmId) {
    const palette = ROLL_THUMB_PALETTE[filmId] || ROLL_THUMB_PALETTE.cinestill;
    const [c1, c2, c3] = palette[0];
    const angle = (seed * 31) % 360;
    return `linear-gradient(${angle}deg, ${c1} 0%, ${c2} 50%, ${c3} 100%)`;
  }

  const STORAGE = {
    film: 'mc_film',
    shots: 'mc_shots',
    rolls: 'mc_rolls',
    sampleSeen: 'mc_sample_seen'
  };

  const state = {
    film: null,
    shots: 0,
    rolls: [],
    screen: 'camera',
    activeCat: 'all'
  };

  // 初始化
  try {
    const f = localStorage.getItem(STORAGE.film);
    if (f) state.film = JSON.parse(f);
    const s = localStorage.getItem(STORAGE.shots);
    if (s) state.shots = parseInt(s, 10) || 0;
    const r = localStorage.getItem(STORAGE.rolls);
    if (r) state.rolls = JSON.parse(r);
    // 首次访问用 photos 文件夹作为暗房预设
    if (!localStorage.getItem(STORAGE.sampleSeen)) {
      state.rolls = PHOTO_ROLLS.slice();
      localStorage.setItem(STORAGE.sampleSeen, '1');
      localStorage.setItem(STORAGE.rolls, JSON.stringify(state.rolls));
    }
  } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const RING_CIRCUMFERENCE = 2 * Math.PI * 94; // ≈ 590

  function save() {
    try {
      localStorage.setItem(STORAGE.film, JSON.stringify(state.film));
      localStorage.setItem(STORAGE.shots, String(state.shots));
      localStorage.setItem(STORAGE.rolls, JSON.stringify(state.rolls));
    } catch (e) {}
  }

  function showScreen(name) {
    ['camera', 'select', 'develop', 'strip', 'darkroom', 'more'].forEach(s => {
      $(`screen-${s}`).classList.toggle('hidden', s !== name);
    });
    state.screen = name;
  }

  function renderCamera() {
    const filmObj = state.film ? FILMS.find(f => f.id === state.film) : null;
    const title = $('film-title');
    title.textContent = filmObj ? filmObj.name : '选择风格';
    title.className = 'film-title' + (filmObj ? ' ' + filmObj.cssClass : ' dim');

    const remaining = 36 - state.shots;
    const countBtn = $('ring-count-btn');
    countBtn.textContent = String(remaining).padStart(2, '0');
    // 始终可点：未装卷→跳转选择，拍满→无操作
    countBtn.disabled = false;

    const ratio = state.shots / 36;
    const offset = RING_CIRCUMFERENCE * (1 - ratio);
    const ringFg = $('ring-fg');
    ringFg.setAttribute('stroke-dashoffset', offset);
    const RING_COLORS = {
      cinestill: '#ef4444',
      gold: '#fbbf24',
      hp5: '#d1d5db',
      velvia: '#4ade80'
    };
    ringFg.style.stroke = filmObj ? (RING_COLORS[filmObj.id] || '#fff') : '#333';

    const unloadBtn = $('unload-btn');
    const unloadLabel = $('unload-label');
    unloadBtn.classList.remove('ready', 'develop');
    if (!filmObj) {
      unloadBtn.disabled = true;
      unloadLabel.textContent = '提前卸载';
    } else if (state.shots >= 36) {
      unloadBtn.disabled = false;
      unloadBtn.classList.add('develop', filmObj.cssClass);
      unloadLabel.textContent = '卸载并冲扫';
    } else {
      unloadBtn.disabled = false;
      unloadBtn.classList.add('ready');
      unloadLabel.textContent = '提前卸载';
    }

    // tab 高亮
    document.querySelectorAll('#screen-camera .tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === 'camera');
    });
  }

  function renderFilmList() {
    const list = $('film-list');
    list.innerHTML = '';
    FILMS.forEach(film => {
      const card = document.createElement('div');
      card.className = 'film-card';
      const previewsHTML = film.previews.map(url =>
        `<div class="film-preview" style="background-image:url(${url});background-size:cover;background-position:center"></div>`
      ).join('');
      card.innerHTML = `
        <div class="film-card-head">
          <div class="film-card-name ${film.cssClass}">${film.name}</div>
          <div class="film-card-exp">${film.exp}</div>
        </div>
        <div class="film-tags">
          ${film.tags.map(t => `<span class="film-tag">${t}</span>`).join('')}
        </div>
        <div class="film-previews">${previewsHTML}</div>
        <button class="film-select-btn ${film.cssClass}" data-film="${film.id}">
          选择
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      `;
      list.appendChild(card);
    });
  }

  function renderStrip() {
    if (!state.film) return;
    const filmObj = FILMS.find(f => f.id === state.film);
    $('strip-film-name').textContent = filmObj.name;
    $('strip-film-name').className = 'name ' + filmObj.cssClass;
    $('strip-frame-count').textContent = `${state.shots} 张`;

    const list = $('strip-list');
    list.innerHTML = '';
    const total = 36;
    const rows = Math.ceil(total / 3);
    for (let r = 0; r < rows; r++) {
      const row = document.createElement('div');
      row.className = 'strip-row';
      for (let i = 0; i < 3; i++) {
        const idx = r * 3 + i;
        const taken = idx < state.shots;
        const mainNum = String(idx + 1).padStart(2, '0');
        const halfNum = `${mainNum}A`;
        // 用奇数帧放主编号、偶数帧放 A 编号，模拟 Figma 06 的双编号样式
        const label = (i === 0) ? mainNum : (i === 1 ? halfNum : mainNum);
        const frame = document.createElement('div');
        frame.className = 'frame' + (taken ? '' : ' empty');
        if (taken) {
          frame.style.background = previewStyle(idx + 1, state.film);
          frame.innerHTML = `
            <div class="frame-top">${mainNum}${filmObj.name.split(' ')[0]}</div>
            <div class="frame-bottom">${label}</div>
          `;
        }
        row.appendChild(frame);
      }
      list.appendChild(row);
    }
  }

  function renderDarkroom() {
    const list = $('darkroom-list');
    list.innerHTML = '';
    if (state.rolls.length === 0) {
      list.innerHTML = `
        <div class="darkroom-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <circle cx="9" cy="11" r="2"/>
            <path d="M21 16l-5-5-9 9"/>
          </svg>
          <div>暂无保存的胶卷</div>
        </div>
      `;
      return;
    }
    state.rolls.slice().reverse().forEach(roll => {
      const card = document.createElement('div');
      card.className = 'roll-card';
      // 优先用照片缩略图，fallback 到色板
      const thumbBg = roll.thumb
        ? `background-image:url(${roll.thumb});background-size:cover;background-position:center`
        : `background:${rollThumbStyle(roll.firstSeed || 1, roll.film)}`;
      card.innerHTML = `
        <div class="roll-thumb" style="${thumbBg}"></div>
        <div class="roll-info">
          <div class="roll-name ${roll.cssClass}">${roll.name}</div>
          <div class="roll-meta">${roll.count || roll.shots} 张 · ${roll.dateStr}</div>
        </div>
        <div class="roll-arrow">›</div>
      `;
      list.appendChild(card);
    });
  }

  function render() {
    renderCamera();
  }

  // =================== 事件绑定 ===================

  // 顶部标题 → 进入风格选择
  $('film-title-btn').addEventListener('click', () => {
    showScreen('select');
  });

  // 拍摄：点击进度圈中间的数字
  function takeShot() {
    if (!state.film) {
      // 未装卷：跳到选择页
      showScreen('select');
      return;
    }
    if (state.shots >= 36) return;
    state.shots += 1;
    save();
    render();
    // 闪光动效
    const flash = document.createElement('div');
    Object.assign(flash.style, {
      position: 'fixed', inset: '0',
      background: '#fff', opacity: '0.7',
      pointerEvents: 'none', zIndex: '9999',
      transition: 'opacity 0.18s'
    });
    document.body.appendChild(flash);
    requestAnimationFrame(() => { flash.style.opacity = '0'; });
    setTimeout(() => flash.remove(), 200);

    if (state.shots >= 36) {
      setTimeout(() => developFilm(), 350);
    }
  }
  $('ring-count-btn').addEventListener('click', takeShot);

  // 卸载 / 冲扫按钮
  $('unload-btn').addEventListener('click', () => {
    if (!state.film) return;
    developFilm();
  });

  // 选胶卷返回
  document.querySelectorAll('[data-action="back-to-camera"]').forEach(b => {
    b.addEventListener('click', () => showScreen('camera'));
  });

  // 选胶卷 - 分类切换
  document.querySelectorAll('.select-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.select-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      state.activeCat = tab.dataset.cat;
      const cards = document.querySelectorAll('.film-card');
      cards.forEach(c => {
        const filmId = c.querySelector('[data-film]').dataset.film;
        const film = FILMS.find(f => f.id === filmId);
        const match = state.activeCat === 'all' || film.cat === state.activeCat;
        c.style.display = match ? 'block' : 'none';
      });
    });
  });

  // 选胶卷 - 选择按钮
  $('film-list').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-film]');
    if (!btn) return;
    state.film = btn.dataset.film;
    state.shots = 0; // 装入新胶卷清零
    save();
    showScreen('camera');
    render();
  });

  // 标签栏切换
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      if (target === 'camera') {
        showScreen('camera');
        render();
      } else if (target === 'darkroom') {
        showScreen('darkroom');
        renderDarkroom();
        document.querySelectorAll('#screen-darkroom .tab').forEach(t => {
          t.classList.toggle('active', t.dataset.tab === 'darkroom');
        });
      } else if (target === 'more') {
        showScreen('more');
      }
    });
  });

  // 冲扫流程
  function developFilm() {
    if (!state.film || state.shots === 0) return;
    const filmObj = FILMS.find(f => f.id === state.film);
    const sub = $('develop-sub');
    sub.textContent = `卸载胶卷 · ${state.shots} 张`;
    showScreen('develop');
    setTimeout(() => {
      showScreen('strip');
      renderStrip();
    }, 1800);
  }

  // 保存全部到暗房
  $('save-all-btn').addEventListener('click', () => {
    if (!state.film || state.shots === 0) return;
    const filmObj = FILMS.find(f => f.id === state.film);
    state.rolls.push({
      film: state.film,
      cssClass: filmObj.cssClass,
      name: filmObj.name,
      shots: state.shots,
      firstSeed: Math.floor(Math.random() * 20) + 1,
      dateStr: formatDate(new Date())
    });
    // 重置
    state.film = null;
    state.shots = 0;
    save();
    showScreen('camera');
    render();
  });

  // 初始化
  renderFilmList();
  render();

  // =================== 留言板逻辑 ===================
  const COMMENTS_KEY = "myconcepts_comments_v1";
  const listEl = document.getElementById("commentList");
  const emptyTip = document.getElementById("emptyTip");
  const countEl = document.getElementById("commentCount");
  const form = document.getElementById("commentForm");
  const nameInput = document.getElementById("nameInput");
  const textInput = document.getElementById("textInput");

  function loadComments() {
    try { return JSON.parse(localStorage.getItem(COMMENTS_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveComments(arr) {
    localStorage.setItem(COMMENTS_KEY, JSON.stringify(arr));
  }
  function timeAgo(ts) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return "刚刚";
    if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
    if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
    const d = new Date(ts);
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function renderComments() {
    const arr = loadComments().slice().reverse();
    listEl.innerHTML = "";
    if (arr.length === 0) {
      listEl.appendChild(emptyTip);
      countEl.textContent = "还没有留言";
      return;
    }
    countEl.textContent = `共 ${arr.length} 条留言`;
    arr.forEach((c) => {
      const wrap = document.createElement("div");
      wrap.className = "comment";
      const initial = (c.name || "匿").trim().charAt(0).toUpperCase();
      wrap.innerHTML = `
        <div class="comment__avatar">${escapeHtml(initial)}</div>
        <div class="comment__body">
          <div class="comment__meta">
            <span class="comment__name">${escapeHtml(c.name || "匿名")}</span>
            <span class="comment__time">${timeAgo(c.ts)}</span>
          </div>
          <p class="comment__text">${escapeHtml(c.text)}</p>
        </div>`;
      listEl.appendChild(wrap);
    });
  }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text) return;
    const arr = loadComments();
    arr.push({ name: nameInput.value.trim(), text: text, ts: Date.now() });
    saveComments(arr);
    textInput.value = "";
    renderComments();
  });
  renderComments();
  </script>
</body>
</html>
